<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shambhala Saga</title>
  <link rel="icon" type="image/png" href="images/logo.png" />
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corazón | Shambhala</title>
  <meta
    name="description"
    content="El corazón de Shambhala. Autora, origen, vínculo y dimensión íntima del universo."
  />

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --topbar-height: 88px;
      --page-max: 1380px;
      --page-pad: clamp(22px, 4vw, 72px);
      --content-max: 1240px;
      --text-max: 1120px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(circle at top, rgba(8, 18, 40, 0.88), #000 42%),
        #000;
      color: #fff;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    #stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .space-mist {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 22%, rgba(0, 153, 255, 0.10), transparent 22%),
        radial-gradient(circle at 78% 28%, rgba(107, 196, 255, 0.06), transparent 18%),
        radial-gradient(circle at 50% 75%, rgba(255, 255, 255, 0.03), transparent 20%);
      filter: blur(28px);
      opacity: 0.9;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at center, transparent 48%, rgba(0,0,0,0.14) 74%, rgba(0,0,0,0.50) 100%);
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 60;
      padding: 18px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.82), rgba(0,0,0,0.18));
      backdrop-filter: blur(8px);
    }

    .brand {
      font-family: "Orbitron", sans-serif;
      letter-spacing: 2px;
      font-size: 0.92rem;
      color: rgba(255,255,255,0.92);
      flex-shrink: 0;
    }

    .menu-toggle {
      display: none;
      width: 48px;
      height: 48px;
      border: 1px solid rgba(0,170,255,0.22);
      background: rgba(0,0,0,0.18);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.3s ease;
      padding: 0;
      position: relative;
      flex-shrink: 0;
    }

    .menu-toggle:hover {
      border-color: rgba(0,170,255,0.46);
      box-shadow: 0 0 22px rgba(0,170,255,0.14);
    }

    .menu-toggle span {
      position: absolute;
      width: 20px;
      height: 2px;
      background: rgba(255,255,255,0.92);
      transition: 0.3s ease;
    }

    .menu-toggle span:nth-child(1) {
      transform: translateY(-6px);
    }

    .menu-toggle span:nth-child(2) {
      transform: translateY(0);
    }

    .menu-toggle span:nth-child(3) {
      transform: translateY(6px);
    }

    .menu-toggle.active span:nth-child(1) {
      transform: translateY(0) rotate(45deg);
    }

    .menu-toggle.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle.active span:nth-child(3) {
      transform: translateY(0) rotate(-45deg);
    }

    .top-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .top-links a {
      font-size: 0.78rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      padding: 10px 14px;
      color: rgba(255,255,255,0.82);
      border: 1px solid rgba(0,170,255,0.16);
      background: rgba(0,0,0,0.18);
      transition: 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
    }

    .top-links a:hover {
      color: #9be6ff;
      border-color: rgba(0,170,255,0.4);
      background: rgba(0, 25, 45, 0.26);
    }

    .hero {
      position: relative;
      z-index: 2;
      width: min(var(--page-max), calc(100% - (var(--page-pad) * 2)));
      margin: 0 auto;
      min-height: auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(380px, 520px);
      gap: clamp(34px, 4vw, 72px);
      align-items: center;
      padding: calc(var(--topbar-height) + 34px) 0 54px;
    }

    .hero-copy {
      max-width: 720px;
      min-width: 0;
      position: relative;
      z-index: 2;
      justify-self: start;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
      padding: 12px 18px;
      border: 1px solid rgba(0,170,255,0.26);
      color: rgba(146, 222, 255, 0.92);
      font-family: "Orbitron", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      width: fit-content;
      background: rgba(0, 10, 20, 0.10);
    }

    .eyebrow::before {
      content: "";
      width: 26px;
      height: 1px;
      background: rgba(146, 222, 255, 0.9);
    }

    h1 {
      margin: 0 0 22px;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(2.1rem, 4vw, 3.7rem);
      line-height: 0.98;
      letter-spacing: 1.7px;
      text-transform: uppercase;
      color: #f8fbff;
      text-shadow:
        0 0 8px rgba(255,255,255,0.18),
        0 0 18px rgba(80,170,255,0.08);
      max-width: 100%;
    }

    .hero-subtitle {
      max-width: 680px;
      font-size: 0.97rem;
      line-height: 1.9;
      color: rgba(255,255,255,0.82);
      margin-bottom: 30px;
      text-align: justify;
      text-justify: inter-word;
    }

    .hero-jump-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 0;
    }

    .hero-jump-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border: 1px solid rgba(84, 195, 255, 0.34);
      background:
        linear-gradient(to bottom, rgba(13, 42, 72, 0.52), rgba(8, 20, 35, 0.38));
      color: rgba(242, 248, 255, 0.92);
      font-family: "Orbitron", sans-serif;
      font-size: 0.74rem;
      letter-spacing: 1.7px;
      text-transform: uppercase;
      border-radius: 2px;
      box-shadow:
        inset 0 0 14px rgba(0,170,255,0.05),
        0 0 20px rgba(0,170,255,0.06);
      transition: 0.3s ease;
    }

    .hero-jump-links a:hover {
      color: #ffffff;
      border-color: rgba(102, 210, 255, 0.60);
      background:
        linear-gradient(to bottom, rgba(18, 58, 94, 0.68), rgba(10, 26, 44, 0.46));
      box-shadow:
        0 0 22px rgba(0,170,255,0.14),
        inset 0 0 18px rgba(0,170,255,0.08);
      transform: translateY(-1px);
    }

    .hero-image-wrap {
      position: relative;
      width: 100%;
      min-height: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
      justify-self: end;
    }

    .hero-image-wrap::before {
      content: "";
      position: absolute;
      inset: -30px;
      z-index: 0;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.08), transparent 46%),
        radial-gradient(circle at center, rgba(0, 170, 255, 0.10), transparent 58%);
      filter: blur(30px);
      pointer-events: none;
    }

    .hero-image-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      min-height: 610px;
      overflow: hidden;
      border: 1px solid rgba(0,170,255,0.30);
      background:
        linear-gradient(145deg, #09111d, #04060a 70%);
      box-shadow:
        inset 0 0 28px rgba(0,170,255,0.05),
        0 0 32px rgba(0,170,255,0.14),
        0 0 60px rgba(0,0,0,0.26);
    }

    .hero-image-shell img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      filter: saturate(0.95) brightness(0.84) contrast(1.04);
      transform: scale(1.03);
    }

    .hero-image-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        linear-gradient(to top, rgba(0,0,0,0.84) 10%, rgba(0,0,0,0.34) 50%, rgba(0,0,0,0.08) 100%),
        linear-gradient(to right, rgba(0,0,0,0.18), rgba(0,0,0,0.02)),
        radial-gradient(circle at top, rgba(0,170,255,0.10), transparent 42%);
      pointer-events: none;
    }

    .hero-image-aura {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: 0.92;
      pointer-events: none;
      mix-blend-mode: screen;
      background:
        radial-gradient(circle at 20% 22%, rgba(0, 190, 255, 0.16), transparent 22%),
        radial-gradient(circle at 75% 20%, rgba(120, 220, 255, 0.10), transparent 20%),
        radial-gradient(circle at 50% 75%, rgba(255,255,255,0.05), transparent 20%);
    }

    .section {
      position: relative;
      z-index: 2;
      padding: 68px var(--page-pad) 52px;
    }

    .section.first-section {
      padding-top: 46px;
    }

    .section-header {
      max-width: var(--content-max);
      margin: 0 auto 30px;
    }

    .section-kicker {
      margin-bottom: 14px;
      font-family: "Orbitron", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      color: rgba(140, 223, 255, 0.82);
    }

    .section h2 {
      margin: 0 0 16px;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(1.3rem, 2.1vw, 1.8rem);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(0,150,255,0.12);
    }

    .section-header p {
      margin: 0;
      max-width: 760px;
      line-height: 1.85;
      color: rgba(255,255,255,0.76);
      font-size: 0.96rem;
      text-align: justify;
      text-justify: inter-word;
    }

    .featured-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 26px;
      max-width: var(--content-max);
      margin: 0 auto;
    }

    .featured-card {
      position: relative;
      overflow: hidden;
      min-height: 600px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      border: 1px solid rgba(0,170,255,0.24);
      background:
        linear-gradient(145deg, #09111d, #04060a 70%);
      box-shadow:
        inset 0 0 28px rgba(0,170,255,0.05),
        0 0 24px rgba(0,170,255,0.10),
        0 0 30px rgba(0,0,0,0.24);
      transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
      isolation: isolate;
    }

    .featured-card.full-width {
      min-height: 700px;
      max-width: var(--content-max);
      margin: 0 auto;
      width: 100%;
    }

    .featured-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      transform: scale(1.03);
      transition: transform 0.6s ease, filter 0.6s ease;
      filter: saturate(0.95) brightness(0.84) contrast(1.04);
    }

    .featured-card:hover .featured-image {
      transform: scale(1.06);
      filter: saturate(1.02) brightness(0.92) contrast(1.06);
    }

    .featured-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(to top, rgba(0,0,0,0.84) 10%, rgba(0,0,0,0.34) 50%, rgba(0,0,0,0.08) 100%),
        linear-gradient(to right, rgba(0,0,0,0.18), rgba(0,0,0,0.02)),
        radial-gradient(circle at top, rgba(0,170,255,0.10), transparent 42%);
    }

    .featured-card:hover {
      transform: translateY(-6px);
      border-color: rgba(0,170,255,0.42);
      box-shadow:
        0 0 22px rgba(0,170,255,0.14),
        0 0 42px rgba(0,170,255,0.10),
        inset 0 0 24px rgba(0,170,255,0.08);
    }

    .character-aura {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: 0.92;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .aura-author {
      background:
        radial-gradient(circle at 20% 22%, rgba(0, 190, 255, 0.16), transparent 22%),
        radial-gradient(circle at 75% 20%, rgba(120, 220, 255, 0.10), transparent 20%),
        radial-gradient(circle at 50% 75%, rgba(255,255,255,0.05), transparent 20%);
    }

    .aura-history {
      background:
        radial-gradient(circle at 22% 20%, rgba(0, 170, 255, 0.12), transparent 22%),
        radial-gradient(circle at 74% 24%, rgba(255, 170, 210, 0.08), transparent 20%),
        radial-gradient(circle at 55% 78%, rgba(255,255,255,0.04), transparent 18%);
    }

    .featured-content {
      position: relative;
      z-index: 3;
      width: min(100%, 1120px);
      max-width: min(1120px, calc(100% - 20px));
    }

    .featured-card.full-width .featured-content {
      width: min(100%, 1180px);
      max-width: min(1180px, calc(100% - 20px));
    }

    .character-tag {
      display: inline-block;
      width: fit-content;
      padding: 7px 12px;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(0,0,0,0.34);
      font-size: 0.68rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: rgba(176, 230, 255, 0.92);
      backdrop-filter: blur(4px);
    }

    .featured-card h3 {
      margin: 0 0 14px;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(1.35rem, 1.9vw, 1.8rem);
      letter-spacing: 1.35px;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(0,0,0,0.35);
      line-height: 1.05;
    }

    .featured-card.full-width h3 {
      font-size: clamp(1.65rem, 3vw, 2.5rem);
      letter-spacing: 1.6px;
      line-height: 1.02;
      margin-bottom: 16px;
    }

    .title-link {
      color: inherit;
      transition: color 0.3s ease;
    }

    .title-link:hover {
      color: #b8eeff;
    }

    .featured-card p {
      margin: 0 0 18px;
      max-width: none;
      width: 100%;
      line-height: 1.8;
      color: rgba(255,255,255,0.86);
      font-size: 0.95rem;
      text-shadow: 0 0 12px rgba(0,0,0,0.35);
      text-align: justify;
      text-justify: inter-word;
    }

    .featured-card.full-width p {
      font-size: 0.98rem;
      line-height: 1.85;
      max-width: none;
      width: 100%;
      margin-bottom: 24px;
    }

    .card-link {
      width: fit-content;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #8bdfff;
      border-bottom: 1px solid rgba(139,223,255,0.35);
      padding-bottom: 5px;
      transition: 0.3s ease;
    }

    .featured-card.full-width .card-link {
      font-size: 0.84rem;
      letter-spacing: 2.6px;
    }

    .featured-card:hover .card-link {
      color: white;
      border-color: rgba(255,255,255,0.56);
    }

    .cinematic-band {
      position: relative;
      z-index: 2;
      padding: 46px var(--page-pad) 14px;
    }

    .cinematic-band-inner {
      max-width: var(--content-max);
      margin: 0 auto;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: flex-start;
      color: rgba(255,255,255,0.56);
      font-size: 0.94rem;
      line-height: 1.8;
    }

    .cinematic-band-left {
      max-width: none;
      width: 100%;
      text-align: justify;
      text-justify: inter-word;
    }

    .cinematic-band-right {
      max-width: none;
      width: 100%;
      text-align: left;
      font-family: "Orbitron", sans-serif;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(130, 220, 255, 0.46);
      font-size: 0.72rem;
      order: -1;
    }

    .history-feature {
      position: relative;
      z-index: 2;
      padding: 36px var(--page-pad) 0;
    }

    .text-section {
      position: relative;
      z-index: 2;
      padding: 24px var(--page-pad) 0;
    }

    .text-panel {
      max-width: var(--text-max);
      margin: 0 auto;
      padding: 34px 32px;
      border: 1px solid rgba(255,255,255,0.10);
      background:
        linear-gradient(to bottom, rgba(255,255,255,0.03), rgba(255,255,255,0.012)),
        rgba(4, 7, 12, 0.82);
      box-shadow:
        inset 0 0 22px rgba(0,170,255,0.04),
        0 0 28px rgba(0,0,0,0.20);
    }

    .history-heading-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .history-heading-row h3 {
      margin: 0;
    }

    .history-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 14px;
      border: 1px solid rgba(0,170,255,0.30);
      background:
        linear-gradient(to bottom, rgba(12, 44, 74, 0.54), rgba(8, 22, 38, 0.40));
      color: #9be6ff;
      font-family: "Orbitron", sans-serif;
      font-size: 0.71rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      box-shadow:
        inset 0 0 12px rgba(0,170,255,0.05),
        0 0 14px rgba(0,170,255,0.06);
      transition: 0.3s ease;
    }

    .history-button:hover {
      color: #ffffff;
      border-color: rgba(0,170,255,0.55);
      background:
        linear-gradient(to bottom, rgba(16, 58, 92, 0.70), rgba(10, 28, 48, 0.46));
      box-shadow:
        0 0 18px rgba(0,170,255,0.14),
        inset 0 0 16px rgba(0,170,255,0.08);
      transform: translateY(-1px);
    }

    .text-panel h3 {
      margin: 0 0 14px;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(0.98rem, 1.5vw, 1.22rem);
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.95);
      line-height: 1.15;
    }

    .subheading {
      margin: 24px 0 12px;
      font-family: "Orbitron", sans-serif;
      font-size: 0.88rem;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: rgba(157, 224, 255, 0.9);
    }

    .text-panel p {
      margin: 0 0 16px;
      max-width: none;
      font-size: 0.96rem;
      line-height: 1.9;
      color: rgba(255,255,255,0.80);
      text-align: justify;
      text-justify: inter-word;
    }

    .text-panel p:last-child {
      margin-bottom: 0;
    }

    .ending {
      position: relative;
      z-index: 2;
      min-height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 68px var(--page-pad) 34px;
      text-align: center;
    }

    .ending-box {
      max-width: 860px;
      padding: 42px 32px;
      border: 1px solid rgba(255,255,255,0.10);
      background:
        linear-gradient(to bottom, rgba(255,255,255,0.04), rgba(255,255,255,0.01)),
        rgba(4, 7, 12, 0.82);
      box-shadow:
        inset 0 0 22px rgba(0,170,255,0.04),
        0 0 28px rgba(0,0,0,0.2);
    }

    .ending-box h2 {
      margin: 0 0 16px;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(1.2rem, 2.1vw, 1.6rem);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(0,150,255,0.12);
    }

    .ending-box p {
      margin: 0;
      line-height: 1.85;
      color: rgba(255,255,255,0.76);
      font-size: 0.96rem;
      text-align: justify;
      text-justify: inter-word;
    }

    .page-footer {
      position: relative;
      z-index: 2;
      padding: 0 var(--page-pad) 78px;
    }

    .page-footer-inner {
      max-width: var(--content-max);
      margin: 0 auto;
      padding-top: 26px;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: grid;
      grid-template-columns: repeat(3, min
