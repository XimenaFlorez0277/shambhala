<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tu llegada a Shambhala</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  line-height: 1.6;
}

.container {
  max-width: 700px;
  text-align: center;
}

p {
  margin-bottom: 20px;
  opacity: 0.9;
}

button {
  display: block;
  width: 100%;
  margin: 10px 0;
  padding: 14px;
  background: white;
  color: black;
  border: none;
  cursor: pointer;
}

button:hover {
  background: #ccc;
}
</style>
</head>

<body>

<div class="container">
  <p id="text"></p>
  <div id="choices"></div>
</div>

<script>
const scenes = [
  {
    text: "Despiertas. No reconoces el lugar.\n\nUna voz te observa antes de que puedas reaccionar.",
    choices: [
      { text: "¿Quién eres?", type: "cientifica" },
      { text: "La observo en silencio", type: "diana" },
      { text: "Me levanto sin esperar explicación", type: "exploradora" }
    ]
  },
  {
    text: "La compuerta se abre.\n\nEl aire es distinto. Más limpio. Más vivo.",
    choices: [
      { text: "Intento entender cómo es posible", type: "cientifica" },
      { text: "Observo a la mujer que me trajo aquí", type: "diana" },
      { text: "Doy un paso adelante sin dudar", type: "exploradora" }
    ]
  },
  {
    text: "El espacio se despliega ante ti.\n\nPlantas. Luz. Silencio.\nNo debería existir… pero existe.",
    choices: [
      { text: "Analizo cada detalle", type: "cientifica" },
      { text: "Siento una conexión con este lugar", type: "diana" },
      { text: "Quiero explorar todo", type: "exploradora" }
    ]
  }
];

let index = 0;
let score = { cientifica: 0, diana: 0, exploradora: 0 };

function showScene() {
  const scene = scenes[index];
  document.getElementById("text").innerText = scene.text;

  const choicesDiv = document.getElementById("choices");
  choicesDiv.innerHTML = "";

  scene.choices.forEach(choice => {
    const btn = document.createElement("button");
    btn.innerText = choice.text;

    btn.onclick = () => {
      score[choice.type]++;
      index++;

      if (index < scenes.length) {
        showScene();
      } else {
        showResult();
      }
    };

    choicesDiv.appendChild(btn);
  });
}

function showResult() {
  document.getElementById("choices").innerHTML = "";

  let result = Object.keys(score).reduce((a, b) =>
    score[a] > score[b] ? a : b
  );

  const texts = {
    cientifica: "Eres como Cali.\n\nVes patrones donde otros ven caos.\nNo necesitas certezas… necesitas entender.",
    diana: "Eres como Diana.\n\nTu presencia cambia el espacio.\nLas personas no siempre entienden por qué… pero lo sienten.",
    exploradora: "Eres exploradora.\n\nNo esperas respuestas.\nCruzas el umbral incluso cuando no sabes qué hay al otro lado."
  };

  document.getElementById("text").innerText = texts[result];
}

showScene();
</script>

</body>
</html>
