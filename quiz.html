<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tu lugar en Shambhala</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  max-width: 700px;
  text-align: center;
}

p {
  margin-bottom: 20px;
}

button {
  display: block;
  width: 100%;
  margin: 10px 0;
  padding: 14px;
  background: white;
  color: black;
  border: none;
  cursor: pointer;
}

button:hover {
  background: #ccc;
}
</style>
</head>

<body>

<div class="container">
  <p id="question"></p>
  <div id="answers"></div>
</div>

<script>
const questions = [
  {
    question: "La Fundación Portal al Porvenir te ofrece un puesto en su laboratorio orbital. ¿Qué es lo primero que piensas?",
    answers: [
      { text: "¿Qué tecnología tienen exactamente?", type: "cientifica" },
      { text: "¿Quiénes forman parte del equipo?", type: "humana" },
      { text: "¿Qué tan lejos podríamos llegar con esto?", type: "exploradora" }
    ]
  },
  {
    question: "Llegas a Arcadia por primera vez. Ves un ecosistema artificial perfecto bajo la superficie lunar.",
    answers: [
      { text: "Analizo cómo logran mantener el equilibrio", type: "cientifica" },
      { text: "Observo a las personas y cómo viven allí", type: "humana" },
      { text: "Quiero recorrer todo el lugar de inmediato", type: "exploradora" }
    ]
  },
  {
    question: "Durante el viaje, surge una conversación sobre si existen personas verdaderamente malvadas.",
    answers: [
      { text: "Intento entenderlo desde la lógica y la evidencia", type: "cientifica" },
      { text: "Pienso en la empatía y la posibilidad de cambio", type: "humana" },
      { text: "Me interesa más cómo eso afecta el futuro", type: "exploradora" }
    ]
  },
  {
    question: "Tienes acceso a tecnología capaz de avanzar el viaje supralumínico.",
    answers: [
      { text: "Me concentro en resolver el problema físico", type: "cientifica" },
      { text: "Pienso en cómo esto cambiaría a la humanidad", type: "humana" },
      { text: "Solo quiero probarlo y ver hasta dónde llega", type: "exploradora" }
    ]
  }
];

let current = 0;
let score = { cientifica: 0, humana: 0, exploradora: 0 };

function showQuestion() {
  const q = questions[current];
  document.getElementById("question").innerText = q.question;

  const answersDiv = document.getElementById("answers");
  answersDiv.innerHTML = "";

  q.answers.forEach(a => {
    const btn = document.createElement("button");
    btn.innerText = a.text;

    btn.onclick = () => {
      score[a.type]++;
      current++;

      if (current < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    };

    answersDiv.appendChild(btn);
  });
}

function showResult() {
  document.getElementById("answers").innerHTML = "";

  let result = Object.keys(score).reduce((a, b) =>
    score[a] > score[b] ? a : b
  );

  const results = {
    cientifica: "Eres como Cali.\n\nTu mente está orientada a entender lo imposible. Donde otros ven límites, tú ves preguntas.",
    humana: "Eres como Diana.\n\nEntiendes que el futuro no se construye solo con ciencia, sino con personas.",
    exploradora: "Eres exploradora.\n\nNo te basta con teorizar. Necesitas ir, ver y cruzar los límites."
  };

  document.getElementById("question").innerText = results[result];
}

showQuestion();
</script>

</body>
</html>
