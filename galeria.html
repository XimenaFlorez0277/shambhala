<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galería — Susan y Ximena</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;500;700&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      color: #f5f8ff;
      background:
        radial-gradient(circle at top, rgba(16, 40, 78, 0.22), transparent 30%),
        linear-gradient(to bottom, #02040a 0%, #050914 38%, #02040a 100%);
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    #stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.9;
    }

    .page-shell {
      position: relative;
      z-index: 1;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 18px 5%;
      background: linear-gradient(to bottom, rgba(2, 5, 12, 0.9), rgba(2, 5, 12, 0.18));
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .brand {
      font-family: "Orbitron", sans-serif;
      letter-spacing: 0.28em;
      font-size: 0.8rem;
      text-transform: uppercase;
      color: #dff4ff;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .nav-links a {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      padding: 10px 14px;
      border: 1px solid rgba(111, 195, 255, 0.18);
      background: rgba(255, 255, 255, 0.03);
      color: rgba(236, 245, 255, 0.84);
      transition: 0.3s ease;
    }

    .nav-links a:hover {
      border-color: rgba(111, 195, 255, 0.45);
      color: #ffffff;
      box-shadow: 0 0 24px rgba(67, 161, 255, 0.16);
      transform: translateY(-1px);
    }

    .hero {
      position: relative;
      padding: 150px 7% 50px;
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 14px;
      font-family: "Orbitron", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #a9defe;
      border: 1px solid rgba(139, 216, 255, 0.22);
      background: rgba(7, 18, 35, 0.38);
    }

    h1 {
      margin: 0 0 18px;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(2.2rem, 6vw, 4.5rem);
      line-height: 1;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #f7fbff;
      text-shadow:
        0 0 15px rgba(255,255,255,0.35),
        0 0 45px rgba(89,176,255,0.16);
    }

    .hero p {
      max-width: 780px;
      margin: 0 auto;
      font-size: 1rem;
      line-height: 1.9;
      color: rgba(242, 247, 255, 0.82);
    }

    .gallery-section {
      padding: 20px 7% 90px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .gallery-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      background:
        linear-gradient(to bottom, rgba(255,255,255,0.03), rgba(255,255,255,0.01)),
        rgba(7, 12, 22, 0.78);
      box-shadow:
        inset 0 0 20px rgba(108, 187, 255, 0.03),
        0 14px 40px rgba(0, 0, 0, 0.2);
      transition: 0.35s ease;
    }

    .gallery-card:hover {
      transform: translateY(-6px);
      border-color: rgba(112, 196, 255, 0.32);
      box-shadow:
        0 0 28px rgba(76, 170, 245, 0.10),
        0 16px 45px rgba(0, 0, 0, 0.26);
    }

    .gallery-card img {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      display: block;
    }

    .back-wrap {
      margin-top: 34px;
      text-align: center;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 22px;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border: 1px solid rgba(112, 196, 255, 0.32);
      background: rgba(255,255,255,0.03);
      color: #eaf7ff;
      transition: 0.3s ease;
    }

    .back-link:hover {
      transform: translateY(-2px);
      border-color: rgba(112, 196, 255, 0.62);
      box-shadow: 0 0 24px rgba(76, 170, 245, 0.14);
      color: #ffffff;
    }

    @media (max-width: 980px) {
      .gallery-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .topbar {
        padding: 16px 6%;
        flex-direction: column;
        align-items: flex-start;
      }

      .nav-links {
        justify-content: flex-start;
      }

      .hero,
      .gallery-section {
        padding-left: 6%;
        padding-right: 6%;
      }
    }

    @media (max-width: 680px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .topbar,
      .hero,
      .gallery-section {
        padding-left: 5%;
        padding-right: 5%;
      }

      .hero {
        padding-top: 145px;
      }
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>

  <div class="page-shell">
    <header class="topbar">
      <div class="brand">Saga Shambhala</div>

      <nav class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="corazon.html">El corazón</a>
        <a href="galeria.html">Galería</a>
      </nav>
    </header>

    <section class="hero">
      <div class="eyebrow">Memoria compartida</div>
      <h1>Galería</h1>
      <p>
        Un recorrido visual por algunos momentos de Susan y Ximena: afecto, complicidad, historia compartida y la belleza concreta de una vida construida entre dos.
      </p>
    </section>

    <section class="gallery-section">
      <div class="gallery-grid">
        <div class="gallery-card"><img src="images/corazon/susan-ximena-1.jpg" alt="Susan y Ximena 1" /></div>
        <div class="gallery-card"><img src="images/corazon/susan-ximena-2.jpg" alt="Susan y Ximena 2" /></div>
        <div class="gallery-card"><img src="images/corazon/susan-ximena-3.jpg" alt="Susan y Ximena 3" /></div>
        <div class="gallery-card"><img src="images/corazon/susan-ximena-4.jpg" alt="Susan y Ximena 4" /></div>
        <div class="gallery-card"><img src="images/corazon/susan-ximena-5.jpg" alt="Susan y Ximena 5" /></div>
        <div class="gallery-card"><img src="images/corazon/susan-ximena-6.jpg" alt="Susan y Ximena 6" /></div>
        <div class="gallery-card"><img src="images/corazon/susan-ximena-7.jpg" alt="Susan y Ximena 7" /></div>
        <div class="gallery-card"><img src="images/corazon/susan-ximena-8.jpg" alt="Susan y Ximena 8" /></div>
        <div class="gallery-card"><img src="images/corazon/susan-ximena-9.jpg" alt="Susan y Ximena 9" /></div>
        <div class="gallery-card"><img src="images/corazon/susan-ximena-10.jpg" alt="Susan y Ximena 10" /></div>
      </div>

      <div class="back-wrap">
        <a class="back-link" href="corazon.html">Volver a El corazón de Shambhala</a>
      </div>
    </section>
  </div>

  <script>
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createStars() {
      stars = [];
      const count = window.innerWidth < 768 ? 110 : 180;

      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.4 + 0.2,
          speed: Math.random() * 0.22 + 0.03,
          alpha: Math.random() * 0.7 + 0.2
        });
      }
    }

    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const star of stars) {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${star.alpha})`;
        ctx.fill();

        star.x -= star.speed;

        if (star.x < -2) {
          star.x = canvas.width + 2;
          star.y = Math.random() * canvas.height;
        }
      }

      requestAnimationFrame(animateStars);
    }

    resizeCanvas();
    createStars();
    animateStars();

    window.addEventListener("resize", () => {
      resizeCanvas();
      createStars();
    });
  </script>
</body>
</html>
