<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shambhala Saga</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: black;
  color: white;
  overflow-x: hidden;
}

.hero {
  min-height: 100svh;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding-top: 6vh;
  overflow: hidden;
}

#stars {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

/* 🚀 NAVE */
.hero img {
  position: absolute;
  top: 48%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(110vw, 1100px);
  z-index: 2;
  animation: drift 6s ease-in-out infinite;
}

@keyframes drift {
  0%,100% { transform: translate(-50%, -50%) translateY(0); }
  50% { transform: translate(-50%, -52%) translateY(-10px); }
}

/* TEXTO */
.content {
  position: relative;
  z-index: 4;
}

h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 4rem;
  letter-spacing: 6px;
  text-shadow:
    0 0 10px rgba(255,255,255,0.6),
    0 0 40px rgba(0,150,255,0.7);
}

p {
  font-size: 1.2rem;
  margin-bottom: 40px;
}

.buttons a {
  display: inline-block;
  margin: 10px;
  padding: 12px 25px;
  border: 1px solid white;
  color: white;
  text-decoration: none;
}

</style>
</head>

<body>

<div class="hero">

  <img src="images/hero.jpg">

  <canvas id="stars"></canvas>

  <div class="content">
    <h1>SHAMBHALA SAGA</h1>

    <p>
      Un universo donde las posibilidades se expanden tanto como quienes se atreven a explorarlo.
    </p>

    <div class="buttons">
      <a href="#">Explorar</a>
      <a href="#">Personajes</a>
    </div>
  </div>

</div>

<script>

document.addEventListener("DOMContentLoaded", () => {

  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");

  let stars = [];
  let warp = 1;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function createStars() {
    stars = [];

    for (let i = 0; i < 800; i++) {

      const depth = Math.random();

      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        depth: depth,
        speed: depth * 5 + 0.5
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    stars.forEach(s => {

      const speed = s.speed * warp;

      // 🔥 ZONA LIMPIA CENTRAL
      if (Math.abs(s.x - centerX) < 200 && Math.abs(s.y - centerY) < 150) {
        s.x -= speed;
        return;
      }

      if (s.depth > 0.7) {

        // primer plano (rápido)
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x + speed * 4, s.y);
        ctx.strokeStyle = "white";
        ctx.lineWidth = 1.5;
        ctx.stroke();

      } else if (s.depth > 0.4) {

        // medio
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x + speed * 2, s.y);
        ctx.strokeStyle = "white";
        ctx.lineWidth = 1;
        ctx.stroke();

      } else {

        // fondo
        ctx.beginPath();
        ctx.arc(s.x, s.y, 1, 0, Math.PI * 2);
        ctx.fillStyle = "white";
        ctx.fill();
      }

      s.x -= speed;

      if (s.x < 0) {
        s.x = canvas.width;
        s.y = Math.random() * canvas.height;
      }

    });

    requestAnimationFrame(draw);
  }

  window.addEventListener("scroll", () => {
    warp = 1 + window.scrollY / 150;
  });

  resize();
  createStars();
  draw();

});

</script>

</body>
</html>
