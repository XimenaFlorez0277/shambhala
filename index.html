<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shambhala Saga</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: black;
  color: white;
  overflow-x: hidden;
}

.hero {
  min-height: 100svh;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding-top: 6vh;
  overflow: hidden;
}

#stars {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

/* 🚀 NAVE */
.hero img {
  position: absolute;
  top: 48%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(110vw, 1100px);
  z-index: 2;
  animation: drift 6s ease-in-out infinite;
}

@keyframes drift {
  0%,100% { transform: translate(-50%, -50%) translateY(0); }
  50% { transform: translate(-50%, -52%) translateY(-10px); }
}

/* MOTOR */
.engine-glow {
  position: absolute;
  top: 48%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(110vw, 1100px);
  z-index: 1;
}

.engine-glow::after {
  content: "";
  position: absolute;
  left: 18%;
  top: 52%;
  width: 80px;
  height: 80px;
  background: radial-gradient(circle, #00aaff, transparent 70%);
  filter: blur(25px);
  animation: pulse 2s infinite ease-in-out;
}

@keyframes pulse {
  0%,100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.8); opacity: 1; }
}

/* TEXTO */
.content {
  position: relative;
  z-index: 4;
}

h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 4rem;
  letter-spacing: 6px;
  text-shadow:
    0 0 10px rgba(255,255,255,0.6),
    0 0 40px rgba(0,150,255,0.7);
}

p {
  font-size: 1.2rem;
  margin-bottom: 40px;
}

.buttons a {
  display: inline-block;
  margin: 10px;
  padding: 12px 25px;
  border: 1px solid white;
  color: white;
  text-decoration: none;
}

@media (max-width: 768px) {
  .hero img {
    width: 120vw;
    top: 52%;
  }
  h1 { font-size: 2rem; }
}

</style>
</head>

<body>

<div class="hero">

  <div class="engine-glow"></div>

  <img src="images/hero.jpg" id="ship">

  <canvas id="stars"></canvas>

  <div class="content">
    <h1>SHAMBHALA SAGA</h1>

    <p>
      Un universo donde las posibilidades se expanden tanto como quienes se atreven a explorarlo.
    </p>

    <div class="buttons">
      <a href="#">Explorar</a>
      <a href="#">Personajes</a>
    </div>
  </div>

</div>

<script>

document.addEventListener("DOMContentLoaded", () => {

  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");
  const ship = document.getElementById("ship");

  let stars = [];
  let warp = 1;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function createStars() {
    stars = [];

    for (let i = 0; i < 1500; i++) {

      const depth = Math.random();

      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: depth * 2 + 0.2,
        baseSpeed: depth * 6 + 1,
        depth: depth,
        tilt: (Math.random() - 0.5) * 0.8,
        brightness: 0.5 + Math.random() * 0.5
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    stars.forEach(s => {

      const speed = s.baseSpeed * warp;

      if (s.depth > 0.3) {

        const length = speed * (3 + Math.random() * 3);

        ctx.beginPath();
        ctx.moveTo(s.x, s.y);

        ctx.quadraticCurveTo(
          s.x + length * 0.5,
          s.y + s.tilt * length * 0.5,
          s.x + length,
          s.y + s.tilt * length
        );

        ctx.strokeStyle = `rgba(255,255,255,${s.brightness})`;
        ctx.lineWidth = s.size;
        ctx.stroke();

      } else {

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = "white";
        ctx.fill();
      }

      s.x -= speed;

      if (s.x < 0) {
        s.x = canvas.width;
        s.y = Math.random() * canvas.height;
      }

    });

    requestAnimationFrame(draw);
  }

  window.addEventListener("scroll", () => {
    warp = 1 + window.scrollY / 120;

    const offset = Math.min(warp * 8, 30);
    ship.style.transform = `translate(-50%, -50%) translateY(${offset}px)`;
  });

  resize();
  createStars();
  draw();

  window.addEventListener("resize", () => {
    resize();
    createStars();
  });

});

</script>

</body>
</html>
