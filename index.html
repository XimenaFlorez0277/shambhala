<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shambhala Saga</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: black;
  color: white;
  overflow-x: hidden;
}

.hero {
  min-height: 100svh;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding-top: 6vh;
  overflow: hidden;
}

/* 🌌 ESTRELLAS */
#stars {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

/* 🚀 NAVE */
.hero img {
  position: absolute;
  top: 48%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(110vw, 1100px);
  z-index: 2;
  animation: drift 6s ease-in-out infinite;
}

@keyframes drift {
  0%,100% { transform: translate(-50%, -50%) translateY(0); }
  50% { transform: translate(-50%, -52%) translateY(-10px); }
}

/* TEXTO */
.content {
  position: relative;
  z-index: 4;
}

h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 4rem;
  letter-spacing: 6px;
  text-shadow:
    0 0 15px rgba(255,255,255,0.7),
    0 0 60px rgba(0,150,255,0.8);
}

p {
  font-size: 1.2rem;
  margin-bottom: 40px;
}

/* 🔥 BOTONES SCI-FI */
.buttons {
  display: flex;
  gap: 20px;
  justify-content: center;
}

.btn {
  position: relative;
  padding: 14px 30px;
  text-decoration: none;
  color: rgba(255,255,255,0.9);
  font-size: 0.9rem;
  letter-spacing: 2px;
  border: 1px solid rgba(0,170,255,0.5);
  background: rgba(0,0,0,0.4);
  overflow: hidden;
  transition: 0.3s;

  box-shadow:
    0 0 10px rgba(0,170,255,0.4),
    inset 0 0 15px rgba(0,170,255,0.1);
}

/* pulso */
.btn::after {
  content: "";
  position: absolute;
  inset: 0;
  border: 1px solid rgba(0,170,255,0.3);
  animation: pulse 2.5s infinite;
}

@keyframes pulse {
  0% { opacity: 0.2; }
  50% { opacity: 0.6; }
  100% { opacity: 0.2; }
}

/* scan */
.btn::before {
  content: "";
  position: absolute;
  width: 200%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(0,170,255,0.8), transparent);
  top: 0;
  left: -100%;
  animation: scan 3s linear infinite;
}

@keyframes scan {
  0% { left: -100%; }
  100% { left: 100%; }
}

/* hover */
.btn:hover {
  color: #00aaff;
  border-color: #00aaff;
  box-shadow:
    0 0 20px rgba(0,170,255,1),
    0 0 60px rgba(0,170,255,0.7);
}

/* 📱 MOBILE */
@media (max-width: 768px) {
  .hero img {
    width: 120vw;
    top: 52%;
  }
  h1 { font-size: 2rem; }
}

</style>
</head>

<body>

<div class="hero">

  <img src="images/hero.jpg" alt="Nave Shambhala" id="ship">

  <canvas id="stars"></canvas>

  <div class="content">
    <h1>SHAMBHALA SAGA</h1>

    <p>
      Un universo donde las posibilidades se expanden tanto como quienes se atreven a explorarlo.
    </p>

    <div class="buttons">
      <a href="#" class="btn" id="exploreBtn">Explorar el universo</a>
      <a href="#" class="btn">Personajes</a>
    </div>
  </div>

</div>

<script>

/* 🌌 ESTRELLAS */
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let stars = [];
let warp = 1;
let warpTarget = 1;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function createStars() {
  stars = [];
  for (let i = 0; i < 900; i++) {
    const depth = Math.random();
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      depth: depth,
      speed: depth * 5 + 0.5
    });
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  warp += (warpTarget - warp) * 0.05;

  stars.forEach(s => {

    let speed = s.speed * warp;
    let alpha = 1;
    let lengthFactor = 3;

    if (s.y < canvas.height * 0.3) {
      alpha = 0.2;
      speed *= 0.5;
      lengthFactor = 1;
    }
    else if (s.y < canvas.height * 0.7) {
      alpha = 0.9;
      speed *= 1.6;
      lengthFactor = 4;
    }
    else {
      alpha = 0.2;
      speed *= 0.5;
      lengthFactor = 1;
    }

    if (s.depth > 0.5) {
      const length = speed * lengthFactor;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x + length, s.y);
      ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
      ctx.lineWidth = s.depth * 2;
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(s.x, s.y, 1, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.fill();
    }

    s.x -= speed;

    if (s.x < 0) {
      s.x = canvas.width;
      s.y = Math.random() * canvas.height;
    }

  });

  requestAnimationFrame(draw);
}

resize();
createStars();
draw();

window.addEventListener("resize", () => {
  resize();
  createStars();
});

/* 🚀 WARP FINAL */
const btn = document.getElementById("exploreBtn");
const ship = document.getElementById("ship");

btn.addEventListener("click", (e) => {
  e.preventDefault();

  console.log("WARP ACTIVADO 🚀");

  warpTarget = 25;

  let i = 0;
  const vib = setInterval(() => {
    ship.style.transform =
      `translate(-50%, -50%) translate(${Math.random()*8-4}px, ${Math.random()*8-4}px) scale(1.05)`;
    i++;
    if (i > 25) clearInterval(vib);
  }, 30);
});

</script>

</body>
</html>
