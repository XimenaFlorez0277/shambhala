<script>

const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let stars = [];
let warp = 1;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function createStars() {
  stars = [];

  for (let i = 0; i < 900; i++) {

    const depth = Math.random(); // 🔥 profundidad

    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,

      depth: depth,

      size: depth * 2 + 0.3,

      speed: (depth * 4 + 0.5),

      baseSpeed: (depth * 4 + 0.5)
    });
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  stars.forEach(s => {

    const speed = s.baseSpeed * warp;

    // 🔥 MOTION BLUR SOLO PARA ESTRELLAS RÁPIDAS
    if (speed > 2.5) {

      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x + speed * 2, s.y); // estirado
      ctx.strokeStyle = "white";
      ctx.lineWidth = s.size * 0.8;
      ctx.stroke();

    } else {

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fillStyle = "white";
      ctx.fill();

    }

    s.x -= speed;

    if (s.x < 0) {
      s.x = canvas.width;
      s.y = Math.random() * canvas.height;
    }

  });

  requestAnimationFrame(draw);
}

window.addEventListener("scroll", () => {
  warp = 1 + window.scrollY / 200; // 🔥 más intenso
});

resize();
createStars();
draw();

window.addEventListener("resize", () => {
  resize();
  createStars();
});

</script>
