<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shambhala Saga</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: black;
      color: white;
      overflow: hidden;
    }

    /* HERO */
    .hero {
      min-height: 100svh;
      position: relative;

      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;

      padding-top: 6vh; /* 🔥 TODO MÁS ARRIBA */
    }

    /* ⭐ ESTRELLAS */
    #starsCanvas {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    /* 🚀 NAVE */
    .hero img {
      position: absolute;

      top: 48%; /* 🔥 SUBIMOS LA NAVE */
      left: 50%;
      transform: translate(-50%, -50%);

      width: min(90vw, 900px);
      height: auto;

      z-index: 2;
      opacity: 0.95;

      pointer-events: none;
    }

    /* overlay (ajustado para no matar estrellas) */
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.05),  /* 🔥 casi transparente arriba */
        rgba(0,0,0,0.4),   /* 🔥 suave en medio */
        rgba(0,0,0,0.85)   /* 🔥 oscuro abajo */
      );
      z-index: 1;
    }

    /* contenido */
    .content {
      position: relative;
      z-index: 3;
      max-width: 900px;
      padding: 0 20px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 4rem;
      letter-spacing: 6px;
      margin-bottom: 20px;

      text-shadow:
        0 0 10px rgba(255,255,255,0.4),
        0 0 60px rgba(0,150,255,0.7);
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 40px;
      line-height: 1.6;
      opacity: 0.95;
    }

    .buttons a {
      display: inline-block;
      margin: 10px;
      padding: 12px 25px;
      border: 1px solid white;
      text-decoration: none;
      color: white;
      transition: 0.3s;
    }

    .buttons a:hover {
      color: #00aaff;
      border-color: #00aaff;
    }

    /* 📱 MOBILE */
    @media (max-width: 768px) {

      .hero {
        padding-top: 4vh;
      }

      .hero img {
        top: 52%; /* 🔥 ajuste fino móvil */
        width: 95vw;
      }

      h1 {
        font-size: 2rem;
        letter-spacing: 3px;
      }

      p {
        font-size: 1rem;
      }
    }

  </style>
</head>

<body>

  <div class="hero">

    <canvas id="starsCanvas"></canvas>

    <div class="overlay"></div>

    <img src="images/hero.jpg" alt="Nave Shambhala">

    <div class="content">
      <h1>SHAMBHALA SAGA</h1>

      <p>
        Un universo donde las posibilidades se expanden tanto como quienes se atreven a explorarlo.
      </p>

      <div class="buttons">
        <a href="#">Explorar el universo</a>
        <a href="#">Personajes</a>
      </div>
    </div>

  </div>

  <script>
    const canvas = document.getElementById("starsCanvas");
    const ctx = canvas.getContext("2d");

    let stars = [];
    let numStars = 700;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createStars() {
      stars = [];
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 1.2 + 0.2,
          speed: Math.random() * 2 + 0.3
        });
      }
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      stars.forEach(star => {
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();

        star.x -= star.speed;

        if (star.x < 0) {
          star.x = canvas.width;
          star.y = Math.random() * canvas.height;
        }
      });
    }

    function animate() {
      drawStars();
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", () => {
      resize();
      createStars();
    });

    resize();
    createStars();
    animate();
  </script>

</body>
</html>
