<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shambhala Saga</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  overflow: hidden;
}

/* HERO */
.hero {
  height: 100vh;
  position: relative;
}

/* CANVAS */
#stars {
  position: absolute;
  inset: 0;
}

/* NAVE */
#ship {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 800px;
  transform: translate(-50%, -50%);
  transition: 0.2s;
}

/* BOTÓN */
#exploreBtn {
  position: absolute;
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 25px;
  border: 1px solid cyan;
  cursor: pointer;
}

/* FLASH */
.flash {
  position: fixed;
  inset: 0;
  background: white;
  opacity: 0;
  transition: 0.4s;
}

.flash.active {
  opacity: 1;
}

/* SHAKE */
.shake {
  animation: shake 0.15s infinite;
}

@keyframes shake {
  0% { transform: translate(0,0); }
  50% { transform: translate(3px,-3px); }
  100% { transform: translate(0,0); }
}

</style>
</head>

<body>

<div class="hero" id="hero">

  <img src="images/hero.jpg" id="ship">

  <canvas id="stars"></canvas>

  <button id="exploreBtn">Explorar</button>

</div>

<div class="flash" id="flash"></div>

<script>

/* 🌌 ESTRELLAS */
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let stars = [];
let warp = 1;
let targetWarp = 1;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function createStars() {
  stars = [];
  for (let i = 0; i < 500; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      speed: Math.random() * 4 + 1
    });
  }
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  warp += (targetWarp - warp) * 0.08;

  stars.forEach(s => {
    const speed = s.speed * warp;

    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + speed * 3, s.y);
    ctx.strokeStyle = "white";
    ctx.stroke();

    s.x -= speed;

    if (s.x < 0) {
      s.x = canvas.width;
      s.y = Math.random() * canvas.height;
    }
  });

  requestAnimationFrame(draw);
}

resize();
createStars();
draw();

/* 🚀 EVENTO */
const btn = document.getElementById("exploreBtn");
const ship = document.getElementById("ship");
const flash = document.getElementById("flash");
const hero = document.getElementById("hero");

btn.onclick = () => {

  console.log("CLICK DETECTADO"); // 🔥 DEBUG

  targetWarp = 25;

  hero.classList.add("shake");

  let i = 0;
  const vib = setInterval(() => {
    ship.style.transform =
      `translate(-50%, -50%) translate(${Math.random()*6-3}px, ${Math.random()*6-3}px)`;
    i++;
    if (i > 20) clearInterval(vib);
  }, 30);

  setTimeout(() => {
    flash.classList.add("active");
  }, 800);

};

</script>

</body>
</html>
