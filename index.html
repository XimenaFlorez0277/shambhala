<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shambhala Saga</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: black;
      color: white;
      overflow: hidden;
    }

    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      padding: 7vh 5vw 0;
    }

    #stars {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .ship-wrap {
      position: absolute;
      top: 63%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(108vw, 1120px);
      z-index: 3;
      transition: transform 0.2s ease;
      pointer-events: none;
    }

    .ship-wrap img {
      display: block;
      width: 100%;
      height: auto;
      position: relative;
      z-index: 3;
    }

    .engine-flame {
      position: absolute;
      left: 10.2%;
      top: 52.9%;
      width: 9.2%;
      height: 7.6%;
      transform: translate(-50%, -50%);
      z-index: 5;
      pointer-events: none;
      animation: flameFlicker 0.18s infinite alternate ease-in-out;
      filter: blur(0.3px);
      mix-blend-mode: screen;
    }

    .engine-flame::before {
      content: "";
      position: absolute;
      left: -118%;
      top: -42%;
      width: 228%;
      height: 175%;
      background:
        radial-gradient(
          ellipse at 92% 50%,
          rgba(255,255,255,0.98) 0%,
          rgba(175,235,255,0.92) 16%,
          rgba(45,195,255,0.78) 34%,
          rgba(0,110,255,0.28) 58%,
          rgba(0,70,255,0.04) 76%,
          transparent 100%
        );
      filter: blur(12px);
      opacity: 0.92;
      transform-origin: right center;
      animation: flameGlow 1s infinite ease-in-out;
    }

    .engine-flame::after {
      content: "";
      position: absolute;
      left: -205%;
      top: 7%;
      width: 255%;
      height: 82%;
      background: linear-gradient(
        90deg,
        rgba(0,120,255,0) 0%,
        rgba(0,150,255,0.12) 18%,
        rgba(0,185,255,0.36) 46%,
        rgba(0,215,255,0.72) 74%,
        rgba(255,255,255,0.96) 100%
      );
      clip-path: polygon(
        0% 50%,
        24% 20%,
        60% 2%,
        100% 15%,
        93% 50%,
        100% 85%,
        60% 98%,
        24% 80%
      );
      filter: blur(6px);
      opacity: 0.95;
      transform-origin: right center;
      animation:
        flameStretch 0.22s infinite alternate ease-in-out,
        flameShimmer 1.1s infinite linear;
    }

    @keyframes flameFlicker {
      0% {
        transform: translate(-50%, -50%) scaleX(0.96) scaleY(0.95) rotate(-1deg);
        opacity: 0.88;
      }
      50% {
        transform: translate(-50%, -50%) scaleX(1.04) scaleY(1.08) translateY(-1px) rotate(1deg);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scaleX(0.98) scaleY(0.92) translateY(1px) rotate(-0.8deg);
        opacity: 0.9;
      }
    }

    @keyframes flameGlow {
      0% {
        transform: scaleX(0.92) scaleY(0.9);
        opacity: 0.72;
      }
      50% {
        transform: scaleX(1.08) scaleY(1.15);
        opacity: 1;
      }
      100% {
        transform: scaleX(0.96) scaleY(0.94);
        opacity: 0.82;
      }
    }

    @keyframes flameStretch {
      0% {
        transform: scaleX(0.9) scaleY(0.95) skewY(-3deg);
      }
      50% {
        transform: scaleX(1.08) scaleY(1.05) skewY(2deg);
      }
      100% {
        transform: scaleX(0.94) scaleY(0.92) skewY(-2deg);
      }
    }

    @keyframes flameShimmer {
      0% {
        filter: blur(6px) brightness(0.95);
      }
      50% {
        filter: blur(8px) brightness(1.15);
      }
      100% {
        filter: blur(6px) brightness(0.98);
      }
    }

    .content {
      position: relative;
      z-index: 6;
      width: 100%;
      max-width: 1180px;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 0 0 16px;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.6rem, 7vw, 5rem);
      line-height: 0.95;
      letter-spacing: 6px;
      text-transform: uppercase;
      text-shadow:
        0 0 15px rgba(255,255,255,0.7),
        0 0 60px rgba(0,150,255,0.8);
    }

    p {
      max-width: 700px;
      margin: 0 0 26px;
      font-size: 1.05rem;
      line-height: 1.7;
      color: rgba(255,255,255,0.9);
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 250px;
      padding: 14px 30px;
      text-decoration: none;
      color: rgba(255,255,255,0.9);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 0.82rem;
      border: 1px solid rgba(0,170,255,0.5);
      background: rgba(0,0,0,0.4);
      overflow: hidden;
      transition: 0.3s ease;
      box-shadow:
        0 0 10px rgba(0,170,255,0.4),
        inset 0 0 15px rgba(0,170,255,0.1);
    }

    .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(0,170,255,0.3);
      animation: pulse 2.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.2; }
      50% { opacity: 0.6; }
      100% { opacity: 0.2; }
    }

    .btn::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(0,170,255,0.8),
        transparent
      );
      top: 0;
      left: -100%;
      animation: scan 3s linear infinite;
    }

    @keyframes scan {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .btn:hover {
      color: #00aaff;
      border-color: #00aaff;
      box-shadow:
        0 0 20px rgba(0,170,255,1),
        0 0 60px rgba(0,170,255,0.7);
      transform: translateY(-2px);
    }

    .transition {
      position: fixed;
      inset: 0;
      background: black;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      transition: opacity 1s ease;
    }

    .transition.active {
      opacity: 1;
    }

    @media (min-width: 1600px) {
      .ship-wrap {
        width: min(100vw, 1180px);
        top: 62%;
      }
    }

    @media (max-width: 1100px) {
      .hero {
        padding-top: 6vh;
      }

      .ship-wrap {
        width: min(98vw, 960px);
        top: 65%;
      }

      .engine-flame {
        left: 10.3%;
        top: 53%;
        width: 9.6%;
        height: 7.9%;
      }

      h1 {
        font-size: clamp(2.4rem, 6.4vw, 4.5rem);
      }

      p {
        max-width: 620px;
        font-size: 1rem;
      }
    }

    @media (max-width: 820px) {
      .hero {
        padding-top: 7vh;
      }

      .ship-wrap {
        width: min(92vw, 680px);
        top: 74%;
      }

      .engine-flame {
        left: 10.6%;
        top: 53.1%;
        width: 10.1%;
        height: 8.1%;
      }

      h1 {
        font-size: clamp(2.2rem, 8vw, 3.8rem);
        letter-spacing: 4px;
      }

      p {
        max-width: 560px;
        font-size: 0.98rem;
        margin-bottom: 22px;
      }

      .buttons {
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .btn {
        width: 100%;
        max-width: 360px;
        min-width: 0;
      }
    }

    @media (max-width: 560px) {
      .hero {
        padding-top: 7vh;
      }

      .content {
        padding: 0 18px;
      }

      .ship-wrap {
        width: 104vw;
        top: 78%;
      }

      .engine-flame {
        left: 10.9%;
        top: 53.4%;
        width: 10.5%;
        height: 8.3%;
      }

      h1 {
        font-size: clamp(1.95rem, 9.3vw, 3rem);
        line-height: 0.98;
        letter-spacing: 3px;
      }

      p {
        max-width: 92%;
        font-size: 0.92rem;
        line-height: 1.55;
        margin-bottom: 18px;
      }

      .btn {
        max-width: 100%;
        padding: 16px 18px;
        font-size: 0.78rem;
        letter-spacing: 1.7px;
      }
    }
  </style>
</head>

<body>

  <div class="hero">
    <div class="ship-wrap" id="shipWrap">
      <img src="images/hero.jpg" alt="Nave Shambhala">
      <div class="engine-flame"></div>
    </div>

    <canvas id="stars"></canvas>

    <div class="content">
      <h1>SHAMBHALA<br>SAGA</h1>

      <p>
        Un universo donde las posibilidades se expanden tanto como quienes se atreven a explorarlo.
      </p>

      <div class="buttons">
        <a href="explorar.html" class="btn" id="exploreBtn">
          Explorar el universo
        </a>

        <a href="personajes.html" class="btn" id="charactersBtn">
          Personajes
        </a>

        <a href="corazon.html" class="btn" id="heartBtn">
          El corazón de Shambhala
        </a>
      </div>
    </div>
  </div>

  <div class="transition" id="transition"></div>

  <script>
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");

    let stars = [];
    let warp = 1;
    let warpTarget = 1;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createStars() {
      stars = [];

      const starCount =
        window.innerWidth <= 560 ? 260 :
        window.innerWidth <= 820 ? 420 :
        800;

      for (let i = 0; i < starCount; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          speed: Math.random() * 4 + 0.5
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      warp += (warpTarget - warp) * 0.05;

      const tailLength = window.innerWidth <= 560 ? 2 : 3;

      stars.forEach(s => {
        const speed = s.speed * warp;

        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x + speed * tailLength, s.y);
        ctx.strokeStyle = "white";
        ctx.stroke();

        s.x -= speed;

        if (s.x < 0) {
          s.x = canvas.width;
          s.y = Math.random() * canvas.height;
        }
      });

      requestAnimationFrame(draw);
    }

    resize();
    createStars();
    draw();

    window.addEventListener("resize", () => {
      resize();
      createStars();
    });

    const ship = document.getElementById("shipWrap");
    const transition = document.getElementById("transition");
    const exploreBtn = document.getElementById("exploreBtn");
    const charactersBtn = document.getElementById("charactersBtn");
    const heartBtn = document.getElementById("heartBtn");

    function cinematicTransition(targetUrl) {
      warpTarget = 20;

      let i = 0;
      const vib = setInterval(() => {
        ship.style.transform =
          `translate(-50%, -50%) translate(${Math.random() * 6 - 3}px, ${Math.random() * 6 - 3}px) scale(1.05)`;
        i++;
        if (i > 25) clearInterval(vib);
      }, 30);

      setTimeout(() => {
        transition.classList.add("active");
      }, 800);

      setTimeout(() => {
        window.location.href = targetUrl;
      }, 1500);
    }

    exploreBtn.addEventListener("click", (e) => {
      e.preventDefault();
      cinematicTransition("explorar.html");
    });

    charactersBtn.addEventListener("click", (e) => {
      e.preventDefault();
      cinematicTransition("personajes.html");
    });

    heartBtn.addEventListener("click", (e) => {
      e.preventDefault();
      cinematicTransition("corazon.html");
    });
  </script>

</body>
</html>
