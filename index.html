<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shambhala</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: black;
      color: white;
      overflow-x: hidden;
    }

    /* HERO */
    .hero {
      height: 100vh;
      background: url('images/hero.jpg') center center / cover no-repeat;
      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* ⭐ ESTRELLAS (MUCHAS Y BIEN DISTRIBUIDAS) */
    .stars {
      position: absolute;
      inset: 0;
      z-index: 1;

      background-image:
        radial-gradient(1px 1px at 20% 30%, white, transparent),
        radial-gradient(1px 1px at 40% 70%, white, transparent),
        radial-gradient(2px 2px at 60% 20%, white, transparent),
        radial-gradient(1px 1px at 80% 50%, white, transparent),
        radial-gradient(2px 2px at 30% 80%, white, transparent),
        radial-gradient(1px 1px at 70% 60%, white, transparent),
        radial-gradient(2px 2px at 90% 10%, white, transparent),
        radial-gradient(1px 1px at 10% 90%, white, transparent),
        radial-gradient(2px 2px at 50% 50%, white, transparent),
        radial-gradient(1px 1px at 75% 25%, white, transparent),
        radial-gradient(1px 1px at 25% 55%, white, transparent),
        radial-gradient(2px 2px at 65% 75%, white, transparent),
        radial-gradient(1px 1px at 85% 85%, white, transparent);

      opacity: 0.8;

      animation: moveStars 120s linear infinite;
    }

    @keyframes moveStars {
      from {
        transform: translate(0,0);
      }
      to {
        transform: translate(-200px, -200px);
      }
    }

    /* overlay oscuro */
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.2),
        rgba(0,0,0,0.85)
      );
      z-index: 2;
    }

    /* contenido */
    .content {
      position: relative;
      z-index: 3;
      animation: fadeUp 1.5s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 4rem;
      letter-spacing: 6px;
      margin-bottom: 20px;
      text-shadow:
        0 0 10px rgba(255,255,255,0.3),
        0 0 40px rgba(0,150,255,0.4);
    }

    p {
      font-size: 1.2rem;
      opacity: 0.9;
      max-width: 600px;
      margin: auto;
      margin-bottom: 30px;
    }

    .buttons a {
      display: inline-block;
      margin: 10px;
      padding: 12px 25px;
      border: 1px solid white;
      text-decoration: none;
      color: white;
      transition: 0.3s;
    }

    .buttons a:hover {
      color: #00aaff;
      border-color: #00aaff;
    }

  </style>
</head>

<body>

  <div class="hero">

    <div class="stars"></div>
    <div class="overlay"></div>

    <div class="content">
      <h1>SHAMBHALA</h1>
      <p>
        La humanidad ya no pertenece a la Tierra.
        Pero tampoco sabe dónde pertenece.
      </p>

      <div class="buttons">
        <a href="#">Explorar el universo</a>
        <a href="#">Personajes</a>
      </div>
    </div>

  </div>

</body>
</html>
