<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Shambhala Saga</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    body {
      overflow-x: hidden;
      background: black;
      color: white;
    }

    /* HERO */
    .hero {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    /* Imagen de fondo (tu nave) */
    .hero img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Overlay oscuro cinematográfico */
    .overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(0,0,0,0.2), rgba(0,0,0,0.85));
      z-index: 2;
    }

    /* CONTENIDO */
    .hero-content {
      position: relative;
      z-index: 3;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .hero-content h1 {
      font-size: 4rem;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .hero-content p {
      font-size: 1.2rem;
      max-width: 600px;
      opacity: 0.9;
    }

    /* ✨ ESTRELLAS - CAPA 1 */
    .stars {
      width: 1px;
      height: 1px;
      background: transparent;
      box-shadow:
        50px 100px white, 200px 300px white, 400px 600px white,
        800px 200px white, 1200px 500px white, 1600px 700px white,
        300px 900px white, 700px 1200px white, 1400px 300px white,
        1800px 800px white, 100px 1300px white, 900px 1500px white,
        1700px 1100px white, 600px 400px white, 1300px 900px white;
      animation: moveStars 120s linear infinite;
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* ✨ CAPA 2 (más estrellas) */
    .stars2 {
      width: 2px;
      height: 2px;
      background: transparent;
      box-shadow:
        150px 200px white, 350px 500px white, 650px 800px white,
        950px 1100px white, 1250px 300px white, 1550px 600px white,
        1750px 900px white, 1850px 1200px white;
      animation: moveStars 200s linear infinite;
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* ✨ CAPA 3 (estrellas grandes) */
    .stars3 {
      width: 3px;
      height: 3px;
      background: transparent;
      box-shadow:
        250px 300px white, 850px 700px white, 1450px 400px white,
        1750px 1000px white;
      animation: moveStars 300s linear infinite;
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Animación */
    @keyframes moveStars {
      from {
        transform: translateY(0px);
      }
      to {
        transform: translateY(-2000px);
      }
    }

  </style>
</head>

<body>

  <section class="hero">

    <!-- ESTRELLAS -->
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>

    <!-- IMAGEN -->
    <img src="images/tu-imagen.jpg" alt="Nave espacial">

    <!-- OVERLAY -->
    <div class="overlay"></div>

    <!-- TEXTO -->
    <div class="hero-content">
      <h1>SHAMBHALA</h1>
      <p>Un viaje más allá de la velocidad de la luz… donde la humanidad cambia para siempre.</p>
    </div>

  </section>

</body>
</html>
