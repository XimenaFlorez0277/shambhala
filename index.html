<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shambhala Saga</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: black;
  color: white;
  overflow: hidden;
}

/* HERO */
.hero {
  min-height: 100vh;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding-top: 6vh;
}

/* ESTRELLAS */
#stars {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

/* NAVE */
.hero img {
  position: absolute;
  top: 48%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(110vw, 1100px);
  z-index: 2;
}

/* TEXTO */
.content {
  position: relative;
  z-index: 4;
}

h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 4rem;
  letter-spacing: 6px;
  text-shadow:
    0 0 15px rgba(255,255,255,0.7),
    0 0 60px rgba(0,150,255,0.8);
}

p {
  margin-bottom: 40px;
}

/* 🔥 BOTONES SCI-FI */
.buttons {
  display: flex;
  gap: 20px;
  justify-content: center;
}

.btn {
  position: relative;
  padding: 14px 30px;
  text-decoration: none;
  color: rgba(255,255,255,0.9);
  letter-spacing: 2px;
  border: 1px solid rgba(0,170,255,0.5);
  background: rgba(0,0,0,0.4);
  overflow: hidden;
  transition: 0.3s;

  box-shadow:
    0 0 10px rgba(0,170,255,0.4),
    inset 0 0 15px rgba(0,170,255,0.1);
}

/* pulso */
.btn::after {
  content: "";
  position: absolute;
  inset: 0;
  border: 1px solid rgba(0,170,255,0.3);
  animation: pulse 2.5s infinite;
}

@keyframes pulse {
  0% { opacity: 0.2; }
  50% { opacity: 0.6; }
  100% { opacity: 0.2; }
}

/* scan */
.btn::before {
  content: "";
  position: absolute;
  width: 200%;
  height: 100%;
  background: linear-gradient(
    120deg,
    transparent,
    rgba(0,170,255,0.8),
    transparent
  );
  top: 0;
  left: -100%;
  animation: scan 3s linear infinite;
}

@keyframes scan {
  0% { left: -100%; }
  100% { left: 100%; }
}

/* hover */
.btn:hover {
  color: #00aaff;
  border-color: #00aaff;
  box-shadow:
    0 0 20px rgba(0,170,255,1),
    0 0 60px rgba(0,170,255,0.7);
}

/* 🌑 TRANSICIÓN NEGRA */
.transition {
  position: fixed;
  inset: 0;
  background: black;
  opacity: 0;
  pointer-events: none;
  z-index: 10;
  transition: opacity 1s ease;
}

.transition.active {
  opacity: 1;
}

@media (max-width: 768px) {
  h1 {
    font-size: 2.6rem;
    letter-spacing: 4px;
  }

  .hero img {
    width: min(130vw, 900px);
  }

  .buttons {
    flex-direction: column;
    align-items: center;
  }
}

</style>
</head>

<body>

<div class="hero">

  <img src="images/hero.jpg" id="ship">

  <canvas id="stars"></canvas>

  <div class="content">
    <h1>SHAMBHALA SAGA</h1>

    <p>
      Un universo donde las posibilidades se expanden tanto como quienes se atreven a explorarlo.
    </p>

    <div class="buttons">
      <a href="explorar.html" class="btn" id="exploreBtn">
        Explorar el universo
      </a>
      <a href="personajes.html" class="btn" id="charactersBtn">
        Personajes
      </a>
    </div>
  </div>

</div>

<div class="transition" id="transition"></div>

<script>

/* ESTRELLAS */
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let stars = [];
let warp = 1;
let warpTarget = 1;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function createStars() {
  stars = [];
  for (let i = 0; i < 800; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      speed: Math.random() * 4 + 0.5
    });
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  warp += (warpTarget - warp) * 0.05;

  stars.forEach(s => {
    const speed = s.speed * warp;

    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + speed * 3, s.y);
    ctx.strokeStyle = "white";
    ctx.stroke();

    s.x -= speed;

    if (s.x < 0) {
      s.x = canvas.width;
      s.y = Math.random() * canvas.height;
    }
  });

  requestAnimationFrame(draw);
}

resize();
createStars();
draw();

window.addEventListener("resize", () => {
  resize();
  createStars();
});

/* 🚀 TRANSICIONES */
const ship = document.getElementById("ship");
const transition = document.getElementById("transition");
const exploreBtn = document.getElementById("exploreBtn");
const charactersBtn = document.getElementById("charactersBtn");

function cinematicTransition(targetUrl) {
  warpTarget = 20;

  let i = 0;
  const vib = setInterval(() => {
    ship.style.transform =
      `translate(-50%, -50%) translate(${Math.random()*6-3}px, ${Math.random()*6-3}px) scale(1.05)`;
    i++;
    if (i > 25) clearInterval(vib);
  }, 30);

  setTimeout(() => {
    transition.classList.add("active");
  }, 800);

  setTimeout(() => {
    window.location.href = targetUrl;
  }, 1500);
}

exploreBtn.addEventListener("click", (e) => {
  e.preventDefault();
  cinematicTransition("explorar.html");
});

charactersBtn.addEventListener("click", (e) => {
  e.preventDefault();
  cinematicTransition("personajes.html");
});

</script>

</body>
</html>
