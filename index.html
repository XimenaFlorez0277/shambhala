<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shambhala Saga</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: black;
  color: white;
  overflow: hidden;
}

/* HERO */
.hero {
  min-height: 100vh;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

/* ESTRELLAS */
#stars {
  position: absolute;
  inset: 0;
  z-index: 3;
}

/* NAVE */
.hero img {
  position: absolute;
  top: 48%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(110vw, 1100px);
  z-index: 2;
}

/* TEXTO */
.content {
  position: relative;
  z-index: 4;
  margin-top: 80px;
}

h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 4rem;
  letter-spacing: 6px;
  text-shadow: 0 0 60px #00aaff;
}

p {
  margin-bottom: 40px;
}

/* BOTONES */
.btn {
  padding: 14px 30px;
  border: 1px solid #00aaff;
  text-decoration: none;
  color: white;
  margin: 10px;
  cursor: pointer;
}

/* 💡 TRANSICIÓN */
.transition {
  position: fixed;
  inset: 0;
  background: white;
  opacity: 0;
  z-index: 10;
  pointer-events: none;
  transition: opacity 1s ease;
}

.transition.active {
  opacity: 1;
}

</style>
</head>

<body>

<div class="hero">

  <img src="images/hero.jpg" id="ship">

  <canvas id="stars"></canvas>

  <div class="content">
    <h1>SHAMBHALA SAGA</h1>

    <p>Un universo donde las posibilidades se expanden tanto como quienes se atreven a explorarlo.</p>

    <a href="explorar.html" class="btn" id="exploreBtn">
      Explorar el universo
    </a>

  </div>

</div>

<div class="transition" id="transition"></div>

<script>

/* ESTRELLAS */
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let stars = [];
let warp = 1;
let warpTarget = 1;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function createStars() {
  stars = [];
  for (let i = 0; i < 800; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      speed: Math.random() * 4 + 0.5
    });
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  warp += (warpTarget - warp) * 0.05;

  stars.forEach(s => {
    const speed = s.speed * warp;

    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + speed * 3, s.y);
    ctx.strokeStyle = "white";
    ctx.stroke();

    s.x -= speed;

    if (s.x < 0) {
      s.x = canvas.width;
      s.y = Math.random() * canvas.height;
    }
  });

  requestAnimationFrame(draw);
}

resize();
createStars();
draw();

/* 🚀 TRANSICIÓN SUAVE */
const btn = document.getElementById("exploreBtn");
const ship = document.getElementById("ship");
const transition = document.getElementById("transition");

btn.addEventListener("click", (e) => {
  e.preventDefault();

  warpTarget = 20;

  // vibración
  let i = 0;
  const vib = setInterval(() => {
    ship.style.transform =
      `translate(-50%, -50%) translate(${Math.random()*6-3}px, ${Math.random()*6-3}px)`;
    i++;
    if (i > 20) clearInterval(vib);
  }, 30);

  // 💡 fade suave
  setTimeout(() => {
    transition.classList.add("active");
  }, 800);

  // 🌌 navegación
  setTimeout(() => {
    window.location.href = "explorar.html";
  }, 1500);

});

</script>

</body>
</html>
