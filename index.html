<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shambhala Saga</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: black;
  color: white;
  overflow-x: hidden;
}

.hero {
  min-height: 100svh;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding-top: 6vh;
  overflow: hidden;
}

/* ESTRELLAS */
#stars {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

/* NAVE */
.hero img {
  position: absolute;
  top: 48%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(110vw, 1100px);
  z-index: 2;
}

/* TEXTO */
.content {
  position: relative;
  z-index: 4;
}

h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 4rem;
  letter-spacing: 6px;
  text-shadow:
    0 0 15px rgba(255,255,255,0.7),
    0 0 60px rgba(0,150,255,0.8);
}

p {
  font-size: 1.2rem;
  margin-bottom: 40px;
}

/* BOTONES */
.buttons {
  display: flex;
  gap: 20px;
}

.btn {
  padding: 14px 30px;
  border: 1px solid rgba(0,170,255,0.6);
  text-decoration: none;
  color: white;
  background: rgba(0,0,0,0.4);
  cursor: pointer;
}

/* FLASH */
.flash {
  position: fixed;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 10;
  transition: opacity 0.5s;
}

.flash.active {
  opacity: 1;
}

</style>
</head>

<body>

<div class="hero">

  <img src="images/hero.jpg" id="ship">

  <canvas id="stars"></canvas>

  <div class="content">
    <h1>SHAMBHALA SAGA</h1>

    <p>
      Un universo donde las posibilidades se expanden tanto como quienes se atreven a explorarlo.
    </p>

    <div class="buttons">
      <a href="#" class="btn" id="exploreBtn">Explorar el universo</a>
      <a href="#" class="btn">Personajes</a>
    </div>
  </div>

</div>

<div class="flash" id="flash"></div>

<script>

/* ESTRELLAS */
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let stars = [];
let warp = 1;
let warpTarget = 1;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function createStars() {
  stars = [];
  for (let i = 0; i < 900; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      speed: Math.random() * 5 + 0.5
    });
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  warp += (warpTarget - warp) * 0.05;

  stars.forEach(s => {
    const speed = s.speed * warp;

    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + speed * 3, s.y);
    ctx.strokeStyle = "white";
    ctx.stroke();

    s.x -= speed;

    if (s.x < 0) {
      s.x = canvas.width;
      s.y = Math.random() * canvas.height;
    }
  });

  requestAnimationFrame(draw);
}

resize();
createStars();
draw();

window.addEventListener("resize", () => {
  resize();
  createStars();
});

/* 🚀 WARP CON TIMING */
const btn = document.getElementById("exploreBtn");
const ship = document.getElementById("ship");
const flash = document.getElementById("flash");

btn.addEventListener("click", (e) => {
  e.preventDefault();

  warpTarget = 25;

  // vibración
  let i = 0;
  const vib = setInterval(() => {
    ship.style.transform =
      `translate(-50%, -50%) translate(${Math.random()*8-4}px, ${Math.random()*8-4}px) scale(1.05)`;
    i++;
    if (i > 30) clearInterval(vib);
  }, 30);

  // ⏳ PAUSA CINEMÁTICA
  setTimeout(() => {
    flash.classList.add("active");
  }, 1200);

  // 🌌 CAMBIO DE SECCIÓN
  setTimeout(() => {
    window.location.href = "#"; // 👉 aquí tu sección real
  }, 1700);

});

</script>

</body>
</html>
