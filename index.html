<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shambhala Saga</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: black;
      color: white;
      overflow-x: hidden;
    }

    .hero {
      height: 100vh;
      background: url('images/hero.jpg') center center / cover no-repeat;
      position: relative;

      display: flex;
      justify-content: center;
      align-items: flex-start;
      text-align: center;
      padding-top: 80px;
    }

    #starsCanvas {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.1),
        rgba(0,0,0,0.9)
      );
      z-index: 2;
    }

    .content {
      position: relative;
      z-index: 3;
      animation: fadeUp 1.5s ease;
      max-width: 900px;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 🔥 TÍTULO PRINCIPAL */
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 4rem;
      letter-spacing: 6px;
      margin-bottom: 25px;

      text-shadow:
        0 0 10px rgba(255,255,255,0.4),
        0 0 50px rgba(0,150,255,0.6);
    }

    /* FRASE */
    p {
      font-size: 1.2rem;
      opacity: 0.95;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .buttons a {
      display: inline-block;
      margin: 10px;
      padding: 12px 25px;
      border: 1px solid white;
      text-decoration: none;
      color: white;
      transition: 0.3s;
    }

    .buttons a:hover {
      color: #00aaff;
      border-color: #00aaff;
    }

  </style>
</head>

<body>

  <div class="hero">

    <canvas id="starsCanvas"></canvas>
    <div class="overlay"></div>

    <div class="content">

      <!-- 🔥 NUEVO TÍTULO -->
      <h1>SHAMBHALA SAGA</h1>

      <!-- 🔥 TU FRASE -->
      <p>
        Un universo donde las posibilidades se expanden tanto como quienes se atreven a explorarlo.
      </p>

      <div class="buttons">
        <a href="#">Explorar el universo</a>
        <a href="#">Personajes</a>
      </div>

    </div>

  </div>

  <script>
    const canvas = document.getElementById("starsCanvas");
    const ctx = canvas.getContext("2d");

    let stars = [];
    let numStars = 700;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createStars() {
      stars = [];
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 1.2 + 0.2,
          speed: Math.random() * 6 + 2
        });
      }
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      stars.forEach(star => {
        ctx.fillStyle = "rgba(255,255,255," + (0.5 + Math.random()*0.5) + ")";
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();

        star.x -= star.speed;

        if (star.x < 0) {
          star.x = canvas.width;
          star.y = Math.random() * canvas.height;
        }
      });
    }

    function animate() {
      drawStars();
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", () => {
      resize();
      createStars();
    });

    resize();
    createStars();
    animate();
  </script>

</body>
</html>
