<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shambhala Saga</title>
  <link rel="icon" type="image/png" href="images/logo.png" />

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --hero-padding-top: 6vh;
      --hero-padding-bottom: 9vh;
      --ship-top: 67%;
      --ship-width: min(92vw, 1120px);
      --content-max: 1180px;
      --counter-bottom: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: black;
      color: white;
      overflow: hidden;
    }

    .hero {
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      padding: var(--hero-padding-top) 5vw var(--hero-padding-bottom);
      overflow: hidden;
      isolation: isolate;
    }

    .ship-wrap {
      position: absolute;
      top: var(--ship-top);
      left: 50%;
      transform: translate(-50%, -50%);
      width: var(--ship-width);
      z-index: 2;
      transition: transform 0.2s ease;
      pointer-events: none;
    }

    .ship-wrap img {
      display: block;
      width: 100%;
      height: auto;
      position: relative;
      z-index: 2;
    }

    #stars {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 6;
      width: 100%;
      max-width: var(--content-max);
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 0 0 16px;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.6rem, 6.6vw, 5.2rem);
      line-height: 0.95;
      letter-spacing: 6px;
      text-transform: uppercase;
      text-shadow:
        0 0 15px rgba(255,255,255,0.7),
        0 0 60px rgba(0,150,255,0.8);
    }

    p {
      max-width: 760px;
      margin: 0 0 28px;
      font-size: 1.05rem;
      line-height: 1.7;
      color: rgba(255,255,255,0.9);
    }

    .buttons {
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
      position: relative;
      z-index: 8;
    }

    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 255px;
      padding: 14px 30px;
      text-decoration: none;
      color: rgba(255,255,255,0.9);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 0.82rem;
      border: 1px solid rgba(0,170,255,0.5);
      background: rgba(0,0,0,0.4);
      overflow: hidden;
      transition: 0.3s ease;
      box-shadow:
        0 0 10px rgba(0,170,255,0.4),
        inset 0 0 15px rgba(0,170,255,0.1);
    }

    .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(0,170,255,0.3);
      animation: pulse 2.5s infinite;
    }

    .btn::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(0,170,255,0.8),
        transparent
      );
      top: 0;
      left: -100%;
      animation: scan 3s linear infinite;
    }

    .btn:hover {
      color: #00aaff;
      border-color: #00aaff;
      box-shadow:
        0 0 20px rgba(0,170,255,1),
        0 0 60px rgba(0,170,255,0.7);
      transform: translateY(-2px);
    }

    .visit-counter-wrap {
      position: absolute;
      left: 50%;
      bottom: var(--counter-bottom);
      transform: translateX(-50%);
      z-index: 7;
      width: calc(100% - 36px);
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .visit-counter {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid rgba(0,170,255,0.22);
      background: rgba(0,0,0,0.42);
      backdrop-filter: blur(10px);
      box-shadow:
        0 0 20px rgba(0,170,255,0.08),
        inset 0 0 14px rgba(0,170,255,0.05);
      color: rgba(255,255,255,0.78);
      font-size: 0.72rem;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
    }

    .visit-counter-label {
      opacity: 0.75;
    }

    .visit-counter-value {
      font-family: 'Orbitron', sans-serif;
      color: #b9ecff;
      letter-spacing: 1.6px;
      opacity: 0.95;
    }

    .transition {
      position: fixed;
      inset: 0;
      background: black;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      transition: opacity 1s ease;
    }

    .transition.active {
      opacity: 1;
    }

    @keyframes pulse {
      0% { opacity: 0.2; }
      50% { opacity: 0.6; }
      100% { opacity: 0.2; }
    }

    @keyframes scan {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    /* TV / pantallas muy grandes */
    @media (min-width: 1700px) {
      :root {
        --hero-padding-top: 4.5vh;
        --hero-padding-bottom: 8vh;
        --ship-top: 71%;
        --ship-width: min(88vw, 1600px);
        --content-max: 1420px;
      }

      h1 {
        font-size: clamp(4.8rem, 5.8vw, 6.8rem);
        letter-spacing: 8px;
        margin-bottom: 18px;
      }

      p {
        max-width: 920px;
        font-size: 1.22rem;
        line-height: 1.8;
        margin-bottom: 34px;
      }

      .buttons {
        gap: 22px;
      }

      .btn {
        min-width: 310px;
        padding: 18px 36px;
        font-size: 0.92rem;
        letter-spacing: 2.3px;
      }

      .visit-counter {
        font-size: 0.8rem;
        padding: 12px 18px;
      }
    }

    /* desktop grande */
    @media (min-width: 1400px) and (max-width: 1699px) {
      :root {
        --hero-padding-top: 5vh;
        --hero-padding-bottom: 8vh;
        --ship-top: 70%;
        --ship-width: min(84vw, 1400px);
        --content-max: 1320px;
      }

      h1 {
        font-size: clamp(4rem, 5.5vw, 6rem);
        letter-spacing: 7px;
      }

      p {
        max-width: 860px;
        font-size: 1.16rem;
        margin-bottom: 32px;
      }

      .btn {
        min-width: 290px;
        padding: 16px 32px;
        font-size: 0.88rem;
      }
    }

    /* laptop / desktop normal */
    @media (min-width: 1101px) and (max-width: 1399px) {
      :root {
        --hero-padding-top: 5.5vh;
        --hero-padding-bottom: 8vh;
        --ship-top: 69%;
        --ship-width: min(86vw, 1180px);
        --content-max: 1180px;
      }

      h1 {
        font-size: clamp(3.3rem, 5.4vw, 5rem);
        letter-spacing: 5px;
      }

      p {
        max-width: 760px;
        font-size: 1.04rem;
        margin-bottom: 28px;
      }

      .btn {
        min-width: 245px;
      }
    }

    @media (max-width: 1100px) {
      :root {
        --hero-padding-top: 6vh;
        --hero-padding-bottom: 8vh;
        --ship-top: 72%;
        --ship-width: min(94vw, 900px);
      }

      h1 {
        font-size: clamp(2.5rem, 6.4vw, 4.4rem);
        letter-spacing: 4px;
      }

      p {
        max-width: 620px;
        font-size: 1rem;
        margin-bottom: 24px;
      }

      .btn {
        min-width: 235px;
        padding: 14px 24px;
      }
    }

    @media (max-width: 820px) {
      :root {
        --hero-padding-top: 6.2vh;
        --hero-padding-bottom: 8vh;
        --ship-top: 79%;
        --ship-width: min(88vw, 620px);
      }

      .content {
        padding: 0 20px;
      }

      h1 {
        font-size: clamp(2.2rem, 8vw, 3.8rem);
        letter-spacing: 4px;
      }

      p {
        max-width: 580px;
        font-size: 0.98rem;
        margin-bottom: 22px;
      }

      .buttons {
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .btn {
        width: 100%;
        max-width: 390px;
        min-width: 0;
      }

      .visit-counter {
        font-size: 0.66rem;
        letter-spacing: 1.2px;
        padding: 9px 12px;
      }
    }

    @media (max-width: 560px) {
      :root {
        --hero-padding-top: 5.2vh;
        --hero-padding-bottom: 24px;
        --ship-top: 78%;
        --ship-width: 82vw;
      }

      body {
        overflow-x: hidden;
        overflow-y: auto;
      }

      .hero {
        overflow-x: hidden;
        overflow-y: auto;
        justify-content: flex-start;
        padding-bottom: 28px;
      }

      .content {
        padding: 0 18px;
      }

      h1 {
        font-size: clamp(2rem, 9vw, 3.15rem);
        line-height: 0.98;
        letter-spacing: 2.2px;
        margin-bottom: 14px;
      }

      p {
        max-width: 100%;
        font-size: 0.94rem;
        line-height: 1.55;
        margin-bottom: 18px;
      }

      .btn {
        max-width: 100%;
        padding: 16px 18px;
        font-size: 0.78rem;
        letter-spacing: 1.7px;
      }

      .visit-counter-wrap {
        position: relative;
        left: auto;
        bottom: auto;
        transform: none;
        width: 100%;
        margin-top: clamp(250px, 42vw, 340px);
        justify-content: center;
        z-index: 7;
      }

      .visit-counter {
        max-width: 100%;
        font-size: 0.62rem;
        letter-spacing: 1px;
        padding: 8px 10px;
        gap: 8px;
      }
    }

    @media (max-width: 430px) {
      :root {
        --hero-padding-top: 5vh;
        --ship-top: 77%;
        --ship-width: 84vw;
      }

      h1 {
        font-size: clamp(1.8rem, 8.8vw, 2.7rem);
        letter-spacing: 1.5px;
      }

      p {
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .btn {
        font-size: 0.75rem;
        letter-spacing: 1.3px;
      }

      .visit-counter-wrap {
        margin-top: clamp(220px, 46vw, 310px);
      }
    }

    @media (max-height: 760px) and (min-width: 900px) {
      :root {
        --hero-padding-top: 4.5vh;
        --ship-top: 70%;
      }

      h1 {
        margin-bottom: 10px;
      }

      p {
        margin-bottom: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="hero">
    <div class="ship-wrap" id="shipWrap">
      <img src="images/hero.jpg" alt="Nave Shambhala">
    </div>

    <canvas id="stars"></canvas>

    <div class="content">
      <h1>SHAMBHALA<br>SAGA</h1>

      <p>
        Un universo donde las posibilidades se expanden tanto como quienes se atreven a explorarlo.
      </p>

      <div class="buttons">
        <a href="explorar.html" class="btn" id="exploreBtn">Explorar el universo</a>
        <a href="personajes.html" class="btn" id="charactersBtn">Personajes</a>
        <a href="corazon.html" class="btn" id="heartBtn">El corazón de Shambhala</a>
      </div>
    </div>

    <div class="visit-counter-wrap">
      <div class="visit-counter" aria-live="polite">
        <span class="visit-counter-label">Visitas:</span>
        <span class="visit-counter-value" id="visitCount">—</span>
      </div>
    </div>
  </div>

  <div class="transition" id="transition"></div>

  <script data-goatcounter="https://shambhalasaga.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>

  <script>
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");

    let stars = [];
    let warp = 1;
    let warpTarget = 1;

    function resize() {
      const hero = document.querySelector(".hero");
      canvas.width = hero.offsetWidth;
      canvas.height = hero.offsetHeight;
    }

    function createStars() {
      stars = [];

      const starCount =
        window.innerWidth <= 560 ? 260 :
        window.innerWidth <= 820 ? 420 :
        800;

      for (let i = 0; i < starCount; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          speed: Math.random() * 4 + 0.5
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      warp += (warpTarget - warp) * 0.05;
      const tailLength = window.innerWidth <= 560 ? 2 : 3;

      stars.forEach((s) => {
        const speed = s.speed * warp;

        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x + speed * tailLength, s.y);
        ctx.strokeStyle = "rgba(255,255,255,0.95)";
        ctx.lineWidth = 1;
        ctx.stroke();

        s.x -= speed;

        if (s.x < -20) {
          s.x = canvas.width + 20;
          s.y = Math.random() * canvas.height;
        }
      });

      requestAnimationFrame(draw);
    }

    resize();
    createStars();
    draw();

    window.addEventListener("resize", () => {
      resize();
      createStars();
    });

    const ship = document.getElementById("shipWrap");
    const transition = document.getElementById("transition");
    const exploreBtn = document.getElementById("exploreBtn");
    const charactersBtn = document.getElementById("charactersBtn");
    const heartBtn = document.getElementById("heartBtn");

    function cinematicTransition(targetUrl) {
      warpTarget = 20;

      let i = 0;
      const vib = setInterval(() => {
        ship.style.transform =
          `translate(-50%, -50%) translate(${Math.random() * 6 - 3}px, ${Math.random() * 6 - 3}px) scale(1.05)`;
        i++;
        if (i > 25) clearInterval(vib);
      }, 30);

      setTimeout(() => {
        transition.classList.add("active");
      }, 800);

      setTimeout(() => {
        window.location.href = targetUrl;
      }, 1500);
    }

    exploreBtn.addEventListener("click", (e) => {
      e.preventDefault();
      cinematicTransition("explorar.html");
    });

    charactersBtn.addEventListener("click", (e) => {
      e.preventDefault();
      cinematicTransition("personajes.html");
    });

    heartBtn.addEventListener("click", (e) => {
      e.preventDefault();
      cinematicTransition("corazon.html");
    });

    const GOATCOUNTER_CODE = "shambhalasaga";
    const visitCount = document.getElementById("visitCount");

    function formatWithDots(value) {
      const raw = String(value ?? "").replace(/[^\d]/g, "");
      if (!raw) return "—";
      return raw.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function loadVisitCounter() {
      fetch(`https://${GOATCOUNTER_CODE}.goatcounter.com/counter/TOTAL.json`)
        .then((response) => {
          if (!response.ok) {
            throw new Error("No se pudo cargar el contador");
          }
          return response.json();
        })
        .then((data) => {
          visitCount.textContent = formatWithDots(data.count);
        })
        .catch(() => {
          visitCount.textContent = "—";
        });
    }

    loadVisitCounter();
  </script>
</body>
</html>
