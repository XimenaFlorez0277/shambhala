<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shambhala</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: black;
      color: white;
      overflow-x: hidden;
    }

    /* HERO */
    .hero {
      height: 100vh;
      background: url('images/hero.jpg') center center / cover no-repeat;
      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

 .stars {
  position: absolute;
  inset: 0;
  z-index: 1;
  overflow: hidden;
}

/* ⭐ CAPA 1 (muchas estrellas pequeñas) */
.stars::before {
  content: "";
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;

  box-shadow:
    50px 100px white, 150px 200px white, 250px 300px white, 350px 400px white,
    450px 500px white, 550px 600px white, 650px 700px white, 750px 800px white,
    850px 900px white, 950px 100px white, 1050px 200px white, 1150px 300px white,
    1250px 400px white, 1350px 500px white, 1450px 600px white, 1550px 700px white,
    1650px 800px white, 1750px 900px white, 1850px 100px white, 1950px 200px white,
    100px 500px white, 300px 700px white, 500px 900px white, 700px 300px white,
    900px 600px white, 1100px 800px white, 1300px 200px white, 1500px 400px white,
    1700px 600px white, 1900px 800px white;

  animation: moveStars 60s linear infinite;
  opacity: 0.8;
}

/* ⭐ CAPA 2 (estrellas más grandes y visibles) */
.stars::after {
  content: "";
  position: absolute;
  width: 3px;
  height: 3px;
  background: rgba(255,255,255,1);
box-shadow: 0 0 6px white;

  box-shadow:
    200px 150px white, 400px 250px white, 600px 350px white,
    800px 450px white, 1000px 550px white, 1200px 650px white,
    1400px 750px white, 1600px 850px white, 1800px 950px white;

  animation: moveStarsSlow 120s linear infinite;
  opacity: 1;
}

/* movimiento */
@keyframes moveStars {
  from { transform: translateY(0); }
  to { transform: translateY(-1000px); }
}

@keyframes moveStarsSlow {
  from { transform: translateY(0); }
  to { transform: translateY(-500px); }
}

    /* overlay */
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.2),
        rgba(0,0,0,0.85)
      );
      z-index: 2;
    }

    /* contenido */
    .content {
      position: relative;
      z-index: 3;
      animation: fadeUp 1.5s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 4rem;
      letter-spacing: 6px;
      margin-bottom: 20px;
      text-shadow:
        0 0 10px rgba(255,255,255,0.3),
        0 0 40px rgba(0,150,255,0.4);
    }

    p {
      font-size: 1.2rem;
      opacity: 0.9;
      max-width: 600px;
      margin: auto;
      margin-bottom: 30px;
    }

    .buttons a {
      display: inline-block;
      margin: 10px;
      padding: 12px 25px;
      border: 1px solid white;
      text-decoration: none;
      color: white;
      transition: 0.3s;
    }

    .buttons a:hover {
      color: #00aaff;
      border-color: #00aaff;
    }

  </style>
</head>

<body>

  <div class="hero">

    <div class="stars"></div>
    <div class="overlay"></div>

    <div class="content">
      <h1>SHAMBHALA</h1>
      <p>
        La humanidad ya no pertenece a la Tierra.
        Pero tampoco sabe dónde pertenece.
      </p>

      <div class="buttons">
        <a href="#">Explorar el universo</a>
        <a href="#">Personajes</a>
      </div>
    </div>

  </div>

</body>
</html>
