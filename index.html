<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shambhala Saga</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --hero-padding-top: 6vh;
      --hero-padding-bottom: 8vh;
      --ship-top: 66%;
      --ship-width: min(96vw, 1180px);
      --content-max: 1180px;
      --counter-bottom: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: black;
      color: white;
      overflow: hidden;
    }

    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--hero-padding-top) 5vw var(--hero-padding-bottom);
      overflow: hidden;
    }

    .ship-wrap {
      position: absolute;
      top: var(--ship-top);
      left: 50%;
      transform: translate(-50%, -50%);
      width: var(--ship-width);
      z-index: 2;
      pointer-events: none;
    }

    .ship-wrap img {
      width: 100%;
      display: block;
    }

    #stars {
      position: absolute;
      inset: 0;
      z-index: 3;
    }

    .content {
      position: relative;
      z-index: 5;
      max-width: var(--content-max);
      text-align: center;
    }

    h1 {
      font-family: 'Orbitron';
      font-size: clamp(2.6rem, 6vw, 5rem);
      text-shadow: 0 0 20px #00aaff;
    }

    p {
      max-width: 700px;
      margin: 20px auto;
    }

    .buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      min-width: 250px;
      padding: 15px;
      border: 1px solid #00aaff;
      background: rgba(0,0,0,0.5);
      color: white;
      text-decoration: none;
    }

    .visit-counter-wrap {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* 🔥 MEJORA CLAVE PARA CELULAR */
    @media (max-width: 560px) {

      body {
        overflow-y: auto;
      }

      .hero {
        overflow-y: auto;
      }

      :root {
        --ship-top: 70%;   /* MÁS ARRIBA */
        --ship-width: 95vw; /* MÁS PEQUEÑA */
      }

      .buttons {
        flex-direction: column;
      }

      .visit-counter-wrap {
        position: relative;
        margin-top: 40px;
      }
    }

    /* 🔥 CELULARES MUY PEQUEÑOS */
    @media (max-width: 430px) {
      :root {
        --ship-top: 68%;
        --ship-width: 90vw;
      }
    }

    /* 🔥 PANTALLAS GRANDES (TU TV) */
    @media (min-width: 1600px) {
      :root {
        --ship-top: 70%;
        --ship-width: 85vw;
      }
    }

  </style>
</head>

<body>

<div class="hero">

  <div class="ship-wrap">
    <img src="images/hero.jpg">
  </div>

  <canvas id="stars"></canvas>

  <div class="content">
    <h1>SHAMBHALA SAGA</h1>
    <p>Un universo donde las posibilidades se expanden tanto como quienes se atreven a explorarlo.</p>

    <div class="buttons">
      <a href="#" class="btn">Explorar el universo</a>
      <a href="#" class="btn">Personajes</a>
      <a href="#" class="btn">El corazón de Shambhala</a>
    </div>
  </div>

  <div class="visit-counter-wrap">
    <div>VISITAS 38</div>
  </div>

</div>

</body>
</html>
