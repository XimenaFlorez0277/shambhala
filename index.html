<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shambhala Saga</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: black;
  color: white;
  overflow-x: hidden;
}

/* HERO */
.hero {
  min-height: 100svh;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding-top: 6vh;
  overflow: hidden;
}

/* ESTRELLAS */
#stars {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

/* 🚀 NAVE */
.hero img {
  position: absolute;
  top: 48%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(110vw, 1100px);
  z-index: 2;
}

/* overlay */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.2);
  z-index: 1;
  transition: background 0.2s;
}

/* TEXTO */
.content {
  position: relative;
  z-index: 4;
  max-width: 900px;
  padding: 0 20px;
}

h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 4rem;
  letter-spacing: 6px;
}

p {
  font-size: 1.2rem;
  margin-bottom: 40px;
}

/* BOTONES */
.buttons a {
  display: inline-block;
  margin: 10px;
  padding: 12px 25px;
  border: 1px solid white;
  color: white;
  text-decoration: none;
}

@media (max-width: 768px) {
  .hero img {
    width: 120vw;
    top: 52%;
  }
  h1 { font-size: 2rem; }
}

</style>
</head>

<body>

<div class="hero">

  <div class="overlay" id="overlay"></div>

  <img src="images/hero.jpg" id="ship">

  <canvas id="stars"></canvas>

  <div class="content">
    <h1>SHAMBHALA SAGA</h1>

    <p>
      Un universo donde las posibilidades se expanden tanto como quienes se atreven a explorarlo.
    </p>

    <div class="buttons">
      <a href="#">Explorar</a>
      <a href="#">Personajes</a>
    </div>
  </div>

</div>

<script>

document.addEventListener("DOMContentLoaded", () => {

  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");
  const ship = document.getElementById("ship");
  const overlay = document.getElementById("overlay");

  let stars = [];
  let warp = 1;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function createStars() {
    stars = [];

    for (let i = 0; i < 1000; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        z: Math.random() * canvas.width
      });
    }
  }

  function draw() {
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    stars.forEach(s => {

      s.z -= warp * 6;

      if (s.z <= 0) {
        s.x = Math.random() * canvas.width;
        s.y = Math.random() * canvas.height;
        s.z = canvas.width;
      }

      const k = 128 / s.z;
      const px = (s.x - cx) * k + cx;
      const py = (s.y - cy) * k + cy;

      const dx = px - cx;
      const dy = py - cy;

      const length = warp * 8;

      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + dx * 0.03 * length, py + dy * 0.03 * length);
      ctx.strokeStyle = "white";
      ctx.lineWidth = (1 - s.z / canvas.width) * 2;
      ctx.stroke();

    });

    requestAnimationFrame(draw);
  }

  window.addEventListener("scroll", () => {

    warp = 1 + window.scrollY / 120;

    // 🚀 nave empuje
    const offset = Math.min(warp * 5, 25);
    ship.style.transform = `translate(-50%, -50%) translateY(${offset}px)`;

    // 🌑 oscurecer
    const darkness = Math.min(warp * 0.25, 0.7);
    overlay.style.background = `rgba(0,0,0,${darkness})`;

  });

  resize();
  createStars();
  draw();

  window.addEventListener("resize", () => {
    resize();
    createStars();
  });

});

</script>

</body>
</html>
