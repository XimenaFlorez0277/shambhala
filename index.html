<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Shambhala</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: black;
  color: white;
}

/* HERO */
.hero {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: radial-gradient(circle at center, #0a0f2a, black 70%);
}

.hero-content {
  max-width: 700px;
}

h1 {
  font-size: 3.5em;
  letter-spacing: 5px;
}

.hero p {
  margin-top: 20px;
  opacity: 0.8;
}

.buttons {
  margin-top: 40px;
}

a {
  display: inline-block;
  margin: 10px;
  padding: 14px 24px;
  background: white;
  color: black;
  text-decoration: none;
  font-weight: bold;
}

a:hover {
  background: #ccc;
}

/* SECCIÓN */
.section {
  padding: 80px 20px;
  text-align: center;
}

.section p {
  max-width: 600px;
  margin: auto;
  opacity: 0.8;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>SHAMBHALA</h1>

    <p>
      La humanidad dio el siguiente paso.<br>
      No todas estaban preparadas.
    </p>

    <div class="buttons">
      <a href="#">Explorar</a>
    </div>
  </div>
</section>

<!-- HOOK -->
<section class="section">
  <h2>Algo cambió</h2>
  <p>
    Un descubrimiento. Una decisión.  
    Un viaje que redefine lo que significa existir.
  </p>
</section>

</body>
</html>
