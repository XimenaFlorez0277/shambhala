<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shambhala</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: black;
      color: white;
      overflow-x: hidden;
    }

    /* HERO */
    .hero {
      height: 100vh;
      background: url('images/hero.jpg') center center / cover no-repeat;
      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* CANVAS ESTRELLAS */
    #starsCanvas {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* overlay */
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.2),
        rgba(0,0,0,0.85)
      );
      z-index: 2;
    }

    /* contenido */
    .content {
      position: relative;
      z-index: 3;
      animation: fadeUp 1.5s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 4rem;
      letter-spacing: 6px;
      margin-bottom: 20px;
      text-shadow:
        0 0 10px rgba(255,255,255,0.3),
        0 0 40px rgba(0,150,255,0.4);
    }

    p {
      font-size: 1.2rem;
      opacity: 0.9;
      max-width: 600px;
      margin: auto;
      margin-bottom: 30px;
    }

    .buttons a {
      display: inline-block;
      margin: 10px;
      padding: 12px 25px;
      border: 1px solid white;
      text-decoration: none;
      color: white;
      transition: 0.3s;
    }

    .buttons a:hover {
      color: #00aaff;
      border-color: #00aaff;
    }

  </style>
</head>

<body>

  <div class="hero">

    <canvas id="starsCanvas"></canvas>

    <div class="overlay"></div>

    <div class="content">
      <h1>SHAMBHALA</h1>
      <p>
        La humanidad ya no pertenece a la Tierra.
        Pero tampoco sabe dónde pertenece.
      </p>

      <div class="buttons">
        <a href="#">Explorar el universo</a>
        <a href="#">Personajes</a>
      </div>
    </div>

  </div>

  <script>
    const canvas = document.getElementById("starsCanvas");
    const ctx = canvas.getContext("2d");

    let stars = [];
    let numStars = 300;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createStars() {
      stars = [];
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 2,
          speed: Math.random() * 0.5 + 0.2
        });
      }
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "white";

      stars.forEach(star => {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();

        star.y -= star.speed;

        if (star.y < 0) {
          star.y = canvas.height;
          star.x = Math.random() * canvas.width;
        }
      });
    }

    function animate() {
      drawStars();
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", () => {
      resize();
      createStars();
    });

    resize();
    createStars();
    animate();
  </script>

</body>
</html>
