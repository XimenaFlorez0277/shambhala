<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shambhala</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: black;
      color: white;
    }

    /* HERO */
    .hero {
      height: 100vh;
      background-image: url('images/hero.jpg');
      background-size: cover;
      background-position: center;
      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* capa oscura */
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.2),
        rgba(0,0,0,0.8)
      );
    }

    /* contenido */
    .content {
      position: relative;
      z-index: 2;

      /* animación suave */
      animation: fadeUp 1.5s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 4rem;
      letter-spacing: 6px;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.85;
      max-width: 600px;
      margin: auto;
      margin-bottom: 30px;
    }

    .buttons a {
      display: inline-block;
      margin: 10px;
      padding: 12px 25px;
      border: 1px solid white;
      text-decoration: none;
      color: white;
      transition: 0.3s;
    }

    .buttons a:hover {
      color: #00aaff;
      border-color: #00aaff;
    }

  </style>
</head>

<body>

  <div class="hero">

    <div class="overlay"></div>

    <div class="content">
      <h1>SHAMBHALA</h1>
      <p>
        La humanidad ya no pertenece a la Tierra.
        Pero tampoco sabe dónde pertenece.
      </p>

      <div class="buttons">
        <a href="#">Explorar el universo</a>
        <a href="#">Personajes</a>
      </div>
    </div>

  </div>

</body>
</html>
