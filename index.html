<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Shambhala</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: black;
      color: white;
    }

    .hero {
      height: 100vh;
      background-image: url('images/hero.jpg');
      background-size: cover;
      background-position: center;
      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
    }

    .content {
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: 50px;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
    }

  </style>
</head>

<body>

  <div class="hero">

    <div class="overlay"></div>

    <div class="content">
      <h1>SHAMBHALA</h1>
      <p>La humanidad ya no pertenece a la Tierra.</p>
    </div>

  </div>

</body>
</html>
