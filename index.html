<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shambhala Saga</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: black;
      color: white;
      overflow: hidden;
    }

    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      padding: 7vh 5vw 0;
    }

    #stars {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .hero img {
      position: absolute;
      top: 58%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(95vw, 900px);
      z-index: 2;
      transition: transform 0.2s ease;
    }

    .content {
      position: relative;
      z-index: 4;
      width: 100%;
      max-width: 1000px;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 0 0 16px;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.6rem, 7vw, 5rem);
      line-height: 0.95;
      letter-spacing: 6px;
      text-transform: uppercase;
      text-shadow:
        0 0 15px rgba(255,255,255,0.7),
        0 0 60px rgba(0,150,255,0.8);
    }

    p {
      max-width: 700px;
      margin: 0 0 26px;
      font-size: 1.05rem;
      line-height: 1.7;
      color: rgba(255,255,255,0.9);
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 250px;
      padding: 14px 30px;
      text-decoration: none;
      color: rgba(255,255,255,0.9);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 0.82rem;
      border: 1px solid rgba(0,170,255,0.5);
      background: rgba(0,0,0,0.4);
      overflow: hidden;
      transition: 0.3s ease;
      box-shadow:
        0 0 10px rgba(0,170,255,0.4),
        inset 0 0 15px rgba(0,170,255,0.1);
    }

    .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(0,170,255,0.3);
      animation: pulse 2.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.2; }
      50% { opacity: 0.6; }
      100% { opacity: 0.2; }
    }

    .btn::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(0,170,255,0.8),
        transparent
      );
      top: 0;
      left: -100%;
      animation: scan 3s linear infinite;
    }

    @keyframes scan {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .btn:hover {
      color: #00aaff;
      border-color: #00aaff;
      box-shadow:
        0 0 20px rgba(0,170,255,1),
        0 0 60px rgba(0,170,255,0.7);
      transform: translateY(-2px);
    }

    .transition {
      position: fixed;
      inset: 0;
      background: black;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      transition: opacity 1s ease;
    }

    .transition.active {
      opacity: 1;
    }

    @media (max-width: 1100px) {
      .hero {
        padding-top: 6vh;
      }

      .hero img {
        width: min(92vw, 820px);
        top: 60%;
      }

      h1 {
        font-size: clamp(2.4rem, 6.4vw, 4.5rem);
      }

      p {
        max-width: 620px;
        font-size: 1rem;
      }
    }

    @media (max-width: 820px) {
      .hero {
        padding-top: 7vh;
      }

      .hero img {
        width: min(95vw, 720px);
        top: 63%;
      }

      h1 {
        font-size: clamp(2.2rem, 8vw, 3.8rem);
        letter-spacing: 4px;
      }

      p {
        max-width: 560px;
        font-size: 0.98rem;
        margin-bottom: 22px;
      }

      .buttons {
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .btn {
        width: 100%;
        max-width: 320px;
        min-width: 0;
      }
    }

    @media (max-width: 560px) {
      .hero {
        padding-top: 8vh;
      }

      .hero img {
        width: 120vw;
        top: 66%;
      }

      h1 {
        font-size: clamp(2rem, 10vw, 3.1rem);
        line-height: 0.98;
      }

      p {
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="hero">
    <img src="images/hero.jpg" id="ship" alt="Nave Shambhala">

    <canvas id="stars"></canvas>

    <div class="content">
      <h1>SHAMBHALA<br>SAGA</h1>

      <p>
        Un universo donde las posibilidades se expanden tanto como quienes se atreven a explorarlo.
      </p>

      <div class="buttons">
        <a href="explorar.html" class="btn" id="exploreBtn">
          Explorar el universo
        </a>

        <a href="personajes.html" class="btn" id="charactersBtn">
          Personajes
        </a>
      </div>
    </div>
  </div>

  <div class="transition" id="transition"></div>

  <script>
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");

    let stars = [];
    let warp = 1;
    let warpTarget = 1;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createStars() {
      stars = [];
      for (let i = 0; i < 800; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          speed: Math.random() * 4 + 0.5
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      warp += (warpTarget - warp) * 0.05;

      stars.forEach(s => {
        const speed = s.speed * warp;

        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x + speed * 3, s.y);
        ctx.strokeStyle = "white";
        ctx.stroke();

        s.x -= speed;

        if (s.x < 0) {
          s.x = canvas.width;
          s.y = Math.random() * canvas.height;
        }
      });

      requestAnimationFrame(draw);
    }

    resize();
    createStars();
    draw();

    window.addEventListener("resize", () => {
      resize();
      createStars();
    });

    const ship = document.getElementById("ship");
    const transition = document.getElementById("transition");
    const exploreBtn = document.getElementById("exploreBtn");
    const charactersBtn = document.getElementById("charactersBtn");

    function cinematicTransition(targetUrl) {
      warpTarget = 20;

      let i = 0;
      const vib = setInterval(() => {
        ship.style.transform =
          `translate(-50%, -50%) translate(${Math.random() * 6 - 3}px, ${Math.random() * 6 - 3}px) scale(1.05)`;
        i++;
        if (i > 25) clearInterval(vib);
      }, 30);

      setTimeout(() => {
        transition.classList.add("active");
      }, 800);

      setTimeout(() => {
        window.location.href = targetUrl;
      }, 1500);
    }

    exploreBtn.addEventListener("click", (e) => {
      e.preventDefault();
      cinematicTransition("explorar.html");
    });

    charactersBtn.addEventListener("click", (e) => {
      e.preventDefault();
      cinematicTransition("personajes.html");
    });
  </script>

</body>
</html>
