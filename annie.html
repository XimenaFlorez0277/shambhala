<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blob interactivo Annie</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(40, 120, 255, 0.18), transparent 25%),
        radial-gradient(circle at 80% 30%, rgba(0, 255, 220, 0.10), transparent 22%),
        linear-gradient(180deg, #020611 0%, #030916 100%);
      overflow: hidden;
      font-family: Inter, system-ui, sans-serif;
      color: white;
    }

    .scene-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #annie-blob {
      position: absolute;
      inset: 0;
    }

    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
    }

    .overlay-inner {
      max-width: 700px;
      margin-top: 55vh;
    }

    .kicker {
      font-size: 0.8rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #8fdcff;
      margin-bottom: 0.8rem;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.2rem, 5vw, 4.5rem);
      line-height: 0.95;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-family: Orbitron, Inter, sans-serif;
    }

    p {
      margin: 0;
      color: rgba(230, 242, 255, 0.82);
      font-size: 1.05rem;
      line-height: 1.75;
    }
  </style>
</head>
