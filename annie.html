<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Annie · Presencia interactiva</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(53, 116, 255, 0.16), transparent 24%),
        radial-gradient(circle at 80% 28%, rgba(0, 255, 210, 0.08), transparent 22%),
        radial-gradient(circle at 50% 70%, rgba(255, 0, 200, 0.06), transparent 24%),
        linear-gradient(180deg, #020611 0%, #040a14 100%);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #eef6ff;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 10% 14%, rgba(255,255,255,0.9) 0 1px, transparent 1.6px),
        radial-gradient(circle at 22% 38%, rgba(255,255,255,0.75) 0 1px, transparent 1.5px),
        radial-gradient(circle at 67% 18%, rgba(255,255,255,0.8) 0 1px, transparent 1.5px),
        radial-gradient(circle at 84% 28%, rgba(255,255,255,0.7) 0 1px, transparent 1.6px),
        radial-gradient(circle at 76% 74%, rgba(255,255,255,0.7) 0 1px, transparent 1.5px),
        radial-gradient(circle at 31% 79%, rgba(255,255,255,0.55) 0 1px, transparent 1.5px);
      opacity: 0.55;
      z-index: 0;
    }

    .scene-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #annie-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 3rem 1.5rem 4rem;
      text-align: center;
    }

    .overlay-inner {
      max-width: 760px;
      background: rgba(5, 14, 29, 0.28);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(138, 216, 255, 0.14);
      border-radius: 28px;
      padding: 1.4rem 1.4rem 1.2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .kicker {
      margin: 0 0 0.8rem;
      color: #8fdcff;
      font-size: 0.8rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-family: Orbitron, Inter, sans-serif;
    }

    h1 {
      margin: 0 0 0.9rem;
      font-size: clamp(2.4rem, 6vw, 5.2rem);
      line-height: 0.95;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-family: Orbitron, Inter, sans-serif;
    }

    p {
      margin: 0;
      color: rgba(230, 242, 255, 0.82);
      font-size: clamp(0.98rem, 1.8vw, 1.08rem);
      line-height: 1.75;
    }

    .hint {
      position: absolute;
      top: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      pointer-events: none;
      color: rgba(180, 208, 235, 0.78);
      font-size: 0.84rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.7rem 1rem;
      border: 1px solid rgba(138, 216, 255, 0.14);
      border-radius: 999px;
      background: rgba(4, 12, 24, 0.45);
      backdrop-filter: blur(10px);
    }

    @media (max-width: 700px) {
      .overlay {
        padding: 1rem 1rem 2rem;
      }

      .overlay-inner {
        border-radius: 22px;
        padding: 1rem;
      }

      .hint {
        top: 0.8rem;
        font-size: 0.72rem;
        width: calc(100% - 2rem);
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="scene-wrap">
    <div class="hint">Mueve el mouse para interactuar con Annie</div>
    <canvas id="annie-canvas" aria-label="Forma interactiva inspirada en Annie"></canvas>

    <div class="overlay">
      <div class="overlay-inner">
        <div class="kicker">Presencia activa</div>
        <h1>Annie</h1>
        <p>
          Una inteligencia distribuida puede sentirse cercana sin adoptar un cuerpo.
          Esta forma responde al movimiento, cambia con la luz y permanece en flujo,
          como una presencia viva dentro de la arquitectura.
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script>
    const canvas = document.getElementById("annie-canvas");

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0, 8.2);

    const ambient = new THREE.AmbientLight(0xffffff, 1.6);
    scene.add(ambient);

    const pointA = new THREE.PointLight(0x9ae8ff, 2.8, 100);
    pointA.position.set(4, 3, 6);
    scene.add(pointA);

    const pointB = new THREE.PointLight(0xff63d8, 2.1, 100);
    pointB.position.set(-4, -2, 5);
    scene.add(pointB);

    const pointC = new THREE.PointLight(0x8dffda, 1.8, 100);
    pointC.position.set(0, 4, 3);
    scene.add(pointC);

    const geometry = new THREE.IcosahedronGeometry(2.1, 80);

    const material = new THREE.MeshPhysicalMaterial({
      color: 0xf6fbff,
      metalness: 0.15,
      roughness: 0.12,
      transmission: 0.08,
      thickness: 1.6,
      clearcoat: 1,
      clearcoatRoughness: 0.08,
      iridescence: 1,
      iridescenceIOR: 1.3,
      reflectivity: 1,
      sheen: 0.5,
      sheenColor: new THREE.Color(0xb7f8ff),
      emissive: new THREE.Color(0x07111f),
      emissiveIntensity: 0.32
    });

    const blob = new THREE.Mesh(geometry, material);
    scene.add(blob);

    const wireMaterial = new THREE.MeshBasicMaterial({
      color: 0xb8f4ff,
      wireframe: true,
      transparent: true,
      opacity: 0.06
    });
    const wireBlob = new THREE.Mesh(geometry.clone(), wireMaterial);
    wireBlob.scale.setScalar(1.012);
    scene.add(wireBlob);

    const positions = geometry.attributes.position;
    const basePositions = new Float32Array(positions.array);

    const mouse = {
      x: 0,
      y: 0,
      targetX: 0,
      targetY: 0
    };

    window.addEventListener("mousemove", (event) => {
      mouse.targetX = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.targetY = -(event.clientY / window.innerHeight) * 2 + 1;
    });

    window.addEventListener("touchmove", (event) => {
      const touch = event.touches[0];
      mouse.targetX = (touch.clientX / window.innerWidth) * 2 - 1;
      mouse.targetY = -(touch.clientY / window.innerHeight) * 2 + 1;
    }, { passive: true });

    const clock = new THREE.Clock();

    function deformBlob(time) {
      for (let i = 0; i < positions.count; i++) {
        const ix = i * 3;
        const x = basePositions[ix];
        const y = basePositions[ix + 1];
        const z = basePositions[ix + 2];

        const vertex = new THREE.Vector3(x, y, z);
        const normal = vertex.clone().normalize();

        const wave1 =
          Math.sin((x * 1.6) + time * 1.2) *
          Math.cos((y * 1.1) + time * 1.1) *
          0.18;

        const wave2 =
          Math.sin((z * 1.8) - time * 1.4) *
          Math.cos((x * 1.2) + time * 0.9) *
          0.14;

        const wave3 =
          Math.sin((x + y + z) * 1.35 + time * 1.6) *
          0.12;

        const distortion = 1 + wave1 + wave2 + wave3;

        positions.array[ix] = normal.x * 2.1 * distortion;
        positions.array[ix + 1] = normal.y * 2.1 * distortion;
        positions.array[ix + 2] = normal.z * 2.1 * distortion;
      }

      positions.needsUpdate = true;
      geometry.computeVertexNormals();

      wireBlob.geometry.attributes.position.array.set(positions.array);
      wireBlob.geometry.attributes.position.needsUpdate = true;
      wireBlob.geometry.computeVertexNormals();
    }

    function animate() {
      requestAnimationFrame(animate);

      const time = clock.getElapsedTime();

      mouse.x += (mouse.targetX - mouse.x) * 0.05;
      mouse.y += (mouse.targetY - mouse.y) * 0.05;

      deformBlob(time);

      blob.rotation.y += 0.0035;
      blob.rotation.x += 0.0018;

      wireBlob.rotation.y = blob.rotation.y + 0.002;
      wireBlob.rotation.x = blob.rotation.x + 0.001;

      blob.position.x = mouse.x * 0.85;
      blob.position.y = mouse.y * 0.55;

      wireBlob.position.x = blob.position.x;
      wireBlob.position.y = blob.position.y;

      blob.rotation.y += mouse.x * 0.01;
      blob.rotation.x += mouse.y * 0.006;

      pointA.position.x = 4 + mouse.x * 2.5;
      pointA.position.y = 3 + mouse.y * 1.5;

      pointB.position.x = -4 - mouse.x * 2;
      pointB.position.y = -2 - mouse.y * 1.3;

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
