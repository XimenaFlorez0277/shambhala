<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explorar — Saga Shambhala</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    body {
      font-family: "Inter", sans-serif;
      background: #02040a;
      color: #fff;
      margin: 0;
    }

    /* ====== FOOTER ESTILO CORAZÓN ====== */

    .page-footer {
      padding: 60px 8% 80px;
    }

    .page-footer-inner {
      max-width: 1280px;
      margin: 0 auto;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 30px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .footer-card {
      position: relative;
      overflow: hidden;
      min-height: 170px;
      border: 1px solid rgba(0,170,255,0.16);
      background: rgba(0,0,0,0.18);
      display: flex;
      align-items: flex-end;
      transition: 0.3s ease;
    }

    .footer-card:hover {
      transform: translateY(-4px);
      border-color: rgba(0,170,255,0.42);
      box-shadow: 0 0 24px rgba(0,170,255,0.14);
    }

    .footer-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.6);
      transform: scale(1.03);
    }

    .footer-card.corazon-card img {
      object-position: center 30%;
    }

    .footer-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, rgba(0,0,0,0.9) 10%, rgba(0,0,0,0.2) 60%),
        radial-gradient(circle at top, rgba(0,170,255,0.12), transparent 44%);
    }

    .footer-card span {
      position: relative;
      z-index: 2;
      padding: 14px 16px;
      font-family: "Orbitron", sans-serif;
      font-size: 0.82rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    /* PREMIO */
    .footer-awards {
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at center, rgba(24,34,58,0.92), rgba(3,7,14,0.98));
    }

    .footer-awards img {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 110px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px gold);
    }

    .footer-awards span {
      position: absolute;
      left: 16px;
      bottom: 14px;
    }

    /* RESPONSIVE */
    @media (max-width: 1000px) {
      .page-footer-inner {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 680px) {
      .page-footer-inner {
        grid-template-columns: 1fr;
      }

      .footer-card {
        min-height: 120px;
      }
    }
  </style>
</head>

<body>

  <!-- CONTENIDO PRINCIPAL (lo que ya tienes arriba lo puedes dejar igual) -->

  <!-- ====== MENÚ FINAL ESTILO CORAZÓN ====== -->
  <footer class="page-footer">

    <div class="page-footer-inner">

      <a href="index.html" class="footer-card">
        <img src="images/hero.jpg" alt="Inicio">
        <span>Inicio</span>
      </a>

      <a href="explorar.html" class="footer-card">
        <img src="images/world.jpg" alt="Explorar">
        <span>Explorar</span>
      </a>

      <a href="corazon.html" class="footer-card corazon-card">
        <img src="images/corazon.jpg" alt="Corazón">
        <span>Corazón</span>
      </a>

      <a href="personajes.html" class="footer-card">
        <img src="images/personajes.jpg" alt="Personajes">
        <span>Personajes</span>
      </a>

      <a href="premios.html" class="footer-card footer-awards">
        <img src="images/premio.png" alt="Premios">
        <span>Premios</span>
      </a>

      <a href="#libros" class="footer-card">
        <img src="images/libros.jpg" alt="Libros">
        <span>Libros</span>
      </a>

    </div>

  </footer>

</body>
</html>
